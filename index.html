<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>てのひら都市</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="スマホのブラウザで遊べる都市づくりシミュレーション。道路を引き、区画を指定して、村を政令指定都市まで育てよう。">
<meta name="theme-color" content="#d9e4e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1519" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="てのひら都市">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: the board fills the screen; a HUD strip floats on top, the tool dock sits at the bottom, sheets rise above the dock. */
:root {
  --bg: #d9e4e8;
  --panel: #fbfcfc;
  --panel-2: #edf1f3;
  --ink: #17212b;
  --muted: #5b6977;
  --line: rgba(23, 33, 43, .13);
  --accent: #0a5fc0;
  --accent-ink: #ffffff;
  --accent-soft: #dbe8fa;
  --res: #2f9655;
  --com: #d4466b;
  --ind: #4766cc;
  --good: #2b8a3e;
  --warn: #b85600;
  --bad: #c92a2a;
  --shadow: 0 1px 2px rgba(15, 25, 35, .10), 0 6px 18px rgba(15, 25, 35, .10);
  --f-display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --dock-h: 146px;
  --hud-b: 96px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1519; --panel: #182027; --panel-2: #222c34; --ink: #e5ecf1; --muted: #9aa8b5;
    --line: rgba(229, 236, 241, .13); --accent: #5ea6ff; --accent-ink: #06121f; --accent-soft: #1b3352;
    --res: #4cc27a; --com: #ff7d9d; --ind: #8aa4ff; --good: #5cc27a; --warn: #ffa94d; --bad: #ff6b6b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1519; --panel: #182027; --panel-2: #222c34; --ink: #e5ecf1; --muted: #9aa8b5;
  --line: rgba(229, 236, 241, .13); --accent: #5ea6ff; --accent-ink: #06121f; --accent-soft: #1b3352;
  --res: #4cc27a; --com: #ff7d9d; --ind: #8aa4ff; --good: #5cc27a; --warn: #ffa94d; --bad: #ff6b6b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

html {
  box-sizing: border-box;
  height: 100%;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: var(--bg);
  overflow: hidden;
  overscroll-behavior: none;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--f-body);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- HUD ---------- */
.hud {
  position: absolute; top: 8px; left: 8px; right: 8px; max-width: 620px; margin: 0 auto;
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  overflow: hidden; z-index: 5;
}
.seg {
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
  padding: 5px 8px; min-width: 0; overflow: hidden; border: 0; border-right: 1px solid var(--line); background: none; text-align: left;
}
.seg:last-child { border-right: 0; }
.hud-main { display: flex; align-items: stretch; min-width: 0; }
.hud-status {
  display: flex; gap: 4px; padding: 4px 5px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%;
  text-align: left; overflow: hidden;
}
.chip {
  flex: 1 1 0; min-width: 0; display: flex; align-items: baseline; justify-content: center; gap: 4px; padding: 2px 4px;
  border-radius: 6px; background: var(--panel-2); font-size: 11px; line-height: 1.5; white-space: nowrap; color: var(--muted);
}
.chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); }
.chip.warn b { color: var(--warn); }
.chip.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); }
.chip.bad b { color: var(--bad); }
.seg .k { font-size: 10px; line-height: 1.2; color: var(--muted); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg .v { font: 400 16px/1.15 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg .d { font-size: 10px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.seg .d.up { color: var(--good); }
.seg .d.down { color: var(--bad); }
.seg-money { flex: 1.45 1 0; }
.seg-pop { flex: 1 1 0; }
.seg-date { flex: 0 0 auto; }
.v.neg { color: var(--bad); }
.seg-rci { flex: 0 0 auto; flex-direction: row; align-items: stretch; gap: 5px; padding: 5px 8px; }
.rci-col { display: grid; grid-template-rows: 1fr auto; justify-items: center; gap: 2px; }
.rci-bar { position: relative; width: 8px; height: 28px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.rci-bar::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.rci-bar i { position: absolute; left: 0; right: 0; height: 0; border-radius: 2px; }
.rci-col b { font-size: 9px; line-height: 1; font-weight: 700; color: var(--muted); }
.rci-r i { background: var(--res); } .rci-c i { background: var(--com); } .rci-i i { background: var(--ind); }
.seg-speed { flex: 0 0 auto; align-items: center; width: 52px; padding: 4px 6px; color: var(--ink); }
.seg-speed svg { width: 22px; height: 18px; fill: currentColor; }
.seg-speed .k { text-align: center; }
.seg-speed[data-speed="0"] { color: var(--warn); }

/* ---------- side buttons ---------- */
.side {
  position: absolute; right: 8px; top: calc(var(--hud-b) + 8px); display: flex; flex-direction: column; gap: 8px; z-index: 4;
}
.side button {
  width: 50px; height: 50px; display: grid; place-items: center; align-content: center; gap: 1px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); padding: 0;
}
.side button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.side button span { font-size: 10px; line-height: 1; font-weight: 700; }
.side button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.side button:disabled { opacity: .4; cursor: default; }

/* ---------- legend ---------- */
.legend {
  position: absolute; left: 8px; right: 66px; top: calc(var(--hud-b) + 8px); z-index: 4; max-width: 440px; margin: 0 auto;
  display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); font-size: 11px;
}
.legend h3 { margin: 0; font-size: 12px; white-space: nowrap; }
.legend .lo, .legend .hi { color: var(--muted); white-space: nowrap; }
.legend .ramp { flex: 1; min-width: 40px; display: flex; height: 10px; border-radius: 3px; overflow: hidden; }
.legend .ramp i { flex: 1; }
.legend .keys { flex: 1; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.legend .keys span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend .keys i { width: 12px; height: 12px; border-radius: 3px; }
.legend .x { flex: 0 0 auto; width: 26px; height: 26px; border: 0; border-radius: 8px; background: var(--panel-2); font-size: 15px; line-height: 1; padding: 0; }
.legend:not([hidden]) ~ .toasts { top: calc(var(--hud-b) + var(--legend-h, 46px) + 8px); }

/* ---------- toasts ---------- */
.toasts {
  position: absolute; top: calc(var(--hud-b) + 8px); left: 8px; right: 66px; max-width: 440px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 6px; z-index: 6; pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; pointer-events: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  font-size: 13px; line-height: 1.45; animation: toast-in .22s ease-out;
}
.toast .dot { flex: 0 0 auto; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--accent); }
.toast.warn .dot { background: var(--warn); }
.toast.bad .dot { background: var(--bad); }
.toast.good .dot { background: var(--good); }
.toast p { margin: 0; flex: 1; min-width: 0; }
.toast button { flex: 0 0 auto; border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 8px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* ---------- tutorial ---------- */
.tut {
  position: absolute; left: 8px; bottom: calc(var(--dock-h) + 8px); z-index: 4; width: 236px; max-width: calc(100% - 80px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
}
.tut-head { display: flex; align-items: center; gap: 6px; padding: 8px 6px 8px 12px; }
.tut-head button.title { flex: 1; text-align: left; border: 0; background: none; padding: 0; font-weight: 700; font-size: 13px; }
.tut-head .count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tut-head .x { border: 0; background: none; width: 28px; height: 28px; border-radius: 8px; color: var(--muted); font-size: 18px; line-height: 1; }
.tut ol { list-style: none; margin: 0; padding: 0 12px 10px; display: flex; flex-direction: column; gap: 5px; }
.tut li { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 1.35; }
.tut li i { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 10px; }
.tut li.done { color: var(--muted); }
.tut li.done i { background: var(--good); border-color: var(--good); color: #fff; }
.tut li.done span { text-decoration: line-through; }
.tut.min ol { display: none; }
.tut-next { display: none; padding: 0 12px 10px; font-size: 12px; line-height: 1.45; }
.tut-next b { display: block; font-size: 13px; }
.tut-next span { color: var(--muted); }
.tut.min .tut-next { display: block; }
.tut.min .tut-head { padding-bottom: 2px; }

/* ---------- dock ---------- */
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(15, 25, 35, .08);
  padding: 5px 0 8px;
}
.hint {
  display: flex; align-items: center; gap: 8px; min-height: 20px;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) 4px max(12px, env(safe-area-inset-left, 0px));
  font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden;
}
.hint b { color: var(--ink); }
.hint span { overflow: hidden; text-overflow: ellipsis; }
.hint .cost { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }
.hint .cost.bad { color: var(--bad); }
.hint .cost.muted { font-weight: 400; color: var(--muted); flex: 0 0 auto; }
.cats {
  display: flex; gap: 6px; padding: 0 10px 6px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x;
}
.cats::-webkit-scrollbar { display: none; }
.cat {
  flex: 0 0 auto; height: 32px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel-2); font-weight: 700; font-size: 12.5px; white-space: nowrap;
}
.cat[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.cat.ico { width: 42px; padding: 0; display: grid; place-items: center; }
.cat.ico svg { width: 22px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cat.ico[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.cats .sep { flex: 0 0 1px; margin: 4px 1px; background: var(--line); }
.tools {
  display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  padding: 0 10px; scroll-padding: 0 10px; touch-action: pan-x; overscroll-behavior-x: contain;
}
.tools::-webkit-scrollbar { display: none; }
.tools .sep { flex: 0 0 1px; align-self: stretch; margin: 6px 2px; background: var(--line); }
.tool {
  position: relative; flex: 0 0 auto; width: 64px; height: 72px; padding: 3px 2px 4px;
  display: grid; grid-template-rows: 38px auto auto; justify-items: center; align-content: center;
  border-radius: 12px; border: 1.5px solid transparent; background: var(--panel-2);
}
.tool canvas, .tool svg { width: 48px; height: 36px; align-self: end; }
.tool svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; padding: 4px 8px 2px; }
.tool .nm { font-size: 11px; font-weight: 700; line-height: 1.25; white-space: nowrap; }
.tool .pr { font-size: 10px; line-height: 1.2; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.tool.poor .pr { color: var(--bad); }
.tool.locked canvas { opacity: .35; filter: grayscale(1); }
.tool.locked .nm { color: var(--muted); }
.tool.locked .pr { color: var(--muted); }
.tool .lock { position: absolute; top: 4px; right: 5px; width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 2; padding: 0; }
.tool[data-zone]::after { content: ""; position: absolute; left: 14px; right: 14px; top: 3px; height: 3px; border-radius: 2px; background: var(--zc); }

/* ---------- sheets ---------- */
.sheet {
  position: absolute; left: 8px; right: 8px; bottom: calc(var(--dock-h) + 8px); z-index: 7;
  max-width: 520px; margin: 0 auto; max-height: calc(100% - var(--dock-h) - var(--hud-b) - 16px);
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  animation: sheet-in .2s ease-out;
}
@keyframes sheet-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.sheet > header { display: flex; align-items: center; gap: 8px; padding: 10px 8px 6px 16px; border-bottom: 1px solid var(--line); }
.sheet h2 { flex: 1; margin: 0; font: 400 17px/1.3 var(--f-display); text-wrap: balance; }
.sheet .close { width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--panel-2); font-size: 20px; line-height: 1; }
.sheet .seg-tabs { margin-top: 10px; }
.sheet-body { overflow-y: auto; padding: 12px 16px 16px; touch-action: pan-y; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px; }
.sheet section h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; padding-left: 12px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.kv .sum { border-top: 1px solid var(--line); padding-top: 5px; margin-top: 2px; }
.kv .pos { color: var(--good); } .kv .neg { color: var(--bad); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.tag.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); font-weight: 700; }
.block-main { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); font-size: 13px; line-height: 1.5; }
.block-main > i { flex: 0 0 auto; width: 12px; height: 12px; margin-top: 4px; border-radius: 3px; }
.block-main div { display: flex; flex-direction: column; gap: 2px; }
.block-main span { color: var(--muted); }
.blocked { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.blocked li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); }
.blocked li > i { flex: 0 0 auto; width: 12px; height: 12px; border-radius: 3px; align-self: flex-start; margin-top: 4px; }
.blocked li div { flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.45; }
.blocked small { color: var(--muted); font-size: 12px; }
.blocked button { flex: 0 0 auto; min-height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-weight: 600; }
.reasons { margin: 0; padding-left: 1.2em; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.meter { position: relative; height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--accent); }
.meter.over i { background: var(--bad); }
.meter.warn i { background: var(--warn); }
.infra { display: flex; flex-direction: column; gap: 10px; }
.infra .row { display: grid; grid-template-columns: 4.5em 1fr; gap: 10px; align-items: center; font-size: 12.5px; }
.infra .meter-cap { grid-column: 2; margin-top: -6px; }
.meter-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.slider-row { display: grid; grid-template-columns: 5.5em 1fr 3.6em; align-items: center; gap: 10px; font-size: 13px; }
.slider-row input { width: 100%; accent-color: var(--accent); height: 28px; margin: 0; }
.slider-row output { font: 400 16px/1 var(--f-display); text-align: right; font-variant-numeric: tabular-nums; }
.sliders { display: flex; flex-direction: column; gap: 2px; }
.seg-tabs { display: flex; gap: 4px; padding: 4px; margin: 0 16px; background: var(--panel-2); border-radius: 10px; }
.seg-tabs button { flex: 1; border: 0; background: none; padding: 7px 0; border-radius: 8px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg-tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.goal { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; align-items: start; font-size: 13px; }
.goal > i { width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 11px; }
.goal.done > i { background: var(--good); border-color: var(--good); color: #fff; }
.goal b { font-weight: 700; }
.goal.done b { color: var(--muted); }
.goal .rw { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal small { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; line-height: 1.45; }
.goal .prog { grid-column: 2 / 4; height: 4px; border-radius: 2px; background: var(--panel-2); overflow: hidden; }
.goal .prog i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.factors { display: flex; flex-direction: column; gap: 7px; }
.factor { display: grid; grid-template-columns: 6.2em 1fr 2.8em; gap: 10px; align-items: center; font-size: 12.5px; }
.factor .meter i { background: var(--good); }
.factor.mid .meter i { background: var(--warn); }
.factor.low .meter i { background: var(--bad); }
.factor span:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.big-num { display: flex; align-items: baseline; gap: 10px; }

.note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
.btn {

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

.layer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.layer-grid button { padding: 10px 6px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel-2); font-weight: 700; font-size: 13px; }
.layer-grid button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.switch-row input { width: 22px; height: 22px; accent-color: var(--accent); }
.name-row { display: flex; align-items: center; gap: 8px; }
.name-row input {

}
.name-row .suffix { font: 400 18px/1 var(--f-display); }
.help { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.6; }
.confirm { padding: 12px; border-radius: 12px; background: color-mix(in srgb, var(--bad) 10%, transparent); display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.transfer { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--panel-2); }
.transfer h4 { margin: 0; font-size: 13px; }
.id-form { display: flex; flex-direction: column; gap: 8px; }
.id-form input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 16px; }
.id-form .note:empty { display: none; }
.id-box { padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); text-align: center; font: 700 21px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; user-select: all; -webkit-user-select: all; }
.welcome .account { display: flex; flex-direction: column; gap: 8px; }
.confirm.info { background: color-mix(in srgb, var(--accent) 10%, transparent); }

/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .ch-grid { stroke: var(--line); stroke-width: 1; }
.chart .ch-zero { stroke: var(--muted); stroke-width: 1; opacity: .5; }
.chart .ch-area { fill: var(--accent); fill-opacity: .1; }
.chart .ch-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ch-dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.chart .ch-txt { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.chart .ch-end { fill: var(--ink); font-size: 11px; font-weight: 700; font-family: var(--f-body); }
.chart .ch-cross { stroke: var(--muted); stroke-width: 1; }
.chart .tip {
  position: absolute; top: 0; pointer-events: none; padding: 4px 8px; border-radius: 8px; white-space: nowrap;
  background: var(--ink); color: var(--panel); font-size: 11px; font-variant-numeric: tabular-nums; transform: translateX(-50%);

.chart .empty { margin: 0; padding: 18px 0; text-align: center; font-size: 12px; color: var(--muted); }

/* ---------- welcome ---------- */
.welcome {

.welcome .eyebrow { margin: 0; font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.welcome h1 { margin: -4px 0 0; font: 400 30px/1.15 var(--f-display); letter-spacing: .02em; }
.welcome p.lead { margin: 0; font-size: 14px; line-height: 1.6; }
.welcome label { font-size: 12px; font-weight: 700; color: var(--muted); }
.welcome .zones { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.welcome .zones span { display: inline-flex; align-items: center; gap: 5px; }
.welcome .zones i { width: 10px; height: 10px; border-radius: 3px; }
body.intro .dock, body.intro .side, body.intro .hud, body.intro .tut { visibility: hidden; }

@media (prefers-reduced-motion: reduce) {
  .toast, .sheet { animation: none; }
  .toast.out { transition: none; }
}
@media (min-width: 700px) {

}
@media (max-height: 520px) {
  .side { gap: 6px; }
  .side button { width: 44px; height: 44px; border-radius: 12px; }
  .side button span { display: none; }
  .hint { display: none; }
  .tut.min .tut-next span { display: none; }
}
.welcome { max-height: calc(100% - 16px); overflow-y: auto; }

    }

      if (apply && f.b.store) markTile(f.o);

  }

      const old = S.trash[i];

}

/* --- pollution, crime and land value --- */
function computeMaps(snap) {
  computeStamps();
  const park = BKEY.park, bigpark = BKEY.bigpark, incin = BKEY.incin;
  for (let y = actLo; y < actHi; y++) for (let i = y * N + actLo, e = y * N + actHi; i < e; i++) {
    const t = S.type[i], L = S.level[i];
    let p = 0;
    if (t === T.IND) p = S.kind[i] ? [0, 10, 18, 28][L] : [0, 60, 110, 160][L];
    else if (t >= 10 && B[t].poll) p = t === incin && !D.powered[i] ? 0 : B[t].poll;
    else if (t === T.ROAD) p = 22 * Math.min(3, D.q[i]);
    else if (t === T.COM && L === 4) p = 12;
    if (S.tree[i]) p -= 25;
    if (t === park) p -= 40;
    if (t === bigpark) p -= 60;
    fa[i] = p;
  }
  blur(fa, 3);
  for (let y = actLo; y < actHi; y++) for (let i = y * N + actLo, e = y * N + actHi; i < e; i++) D.poll[i] = clamp(fa[i] * 2.2, 0, 255);
  for (let y = actLo; y < actHi; y++) for (let i = y * N + actLo, e = y * N + actHi; i < e; i++) {
    const t = S.type[i], L = S.level[i];
    if ((t === T.RES || t === T.COM) && L > 0) {
      const a = D.acc[i];
      fa[i] = 10 + L * 18 + (D.lv[i] < 50 ? 15 : 0) + (t === T.RES && a >= 0 ? (1 - D.emp[a]) * 40 : 0);
    } else fa[i] = 0;
  }
  blur(fa, 2);
  for (let y = actLo; y < actHi; y++) for (let i = y * N + actLo, e = y * N + actHi; i < e; i++) D.crime[i] = clamp(fa[i] * 1.5 * (1 - 0.85 * svcAt('police', i)), 0, 255);
  buildPS(PSA, i => S.tree[i]);
  buildPS(PSB, i => (S.type[i] === T.COM ? JOBS_C[S.level[i]] : 0));
  let crimeHigh = 0, pollHigh = 0;
  for (let y = actLo; y < actHi; y++) for (let x = actLo; x < actHi; x++) {
    const i = y * N + x, t = S.type[i];
    if (S.terrain[i] && t === T.EMPTY) { D.lv[i] = 0; continue; }
    const a = D.acc[i];
    const trees = boxSum(PSA, x - 2, y - 2, x + 2, y + 2), downtown = boxSum(PSB, x - 5, y - 5, x + 5, y + 5);
    const noise = a >= 0 ? Math.min(30, Math.max(0, D.q[a] - 0.8) * 25) : 0;
    const v = 60 + D.waterBonus[i] + Math.min(30, trees * 3) + D.amen[i] * 0.35 + eqAt(i) * 40 + svcAt('health', i) * 15 +
      svcAt('police', i) * 8 + (D.trSub[i] ? 25 : D.trBus[i] ? 8 : 0) + Math.min(30, downtown / 150) -
      D.poll[i] * 0.85 - D.crime[i] * 0.45 - S.trash[i] * 0.3 - noise;
    D.lv[i] = snap ? clamp(v, 0, 255) : Math.round(D.lv[i] * 0.65 + clamp(v, 0, 255) * 0.35);
    if (S.level[i] > 0) {
      if ((t === T.RES || t === T.COM) && D.crime[i] > 110) crimeHigh++;
      if (t === T.RES && D.poll[i] > 70) pollHigh++;
    }
  }
  ST.crimeHigh = crimeHigh; ST.pollHigh = pollHigh;
}

/* --- how residents feel --- */
function computeApproval() {
  const f = { emp: 0, commute: 0, poll: 0, crime: 0, health: 0, edu: 0, trash: 0, water: 0, power: 0 };
  let w = 0;
  for (let i = 0; i < NN; i++) {
    if (S.type[i] !== T.RES || !S.level[i]) continue;
    const p = POP[S.level[i]], a = D.acc[i];
    const e = a >= 0 ? D.emp[a] : 0, cm = a >= 0 ? D.commute[a] : 60;
    f.emp += p * e;
    f.commute += p * clamp(1 - (cm - 12) / 35, 0, 1);
    f.poll += p * clamp(1 - D.poll[i] / 180, 0, 1);
    f.crime += p * clamp(1 - D.crime[i] / 180, 0, 1);
    f.health += p * svcAt('health', i);
    f.edu += p * eqAt(i);
    f.trash += p * (1 - S.trash[i] / 255);
    f.water += p * (D.watered[i] ? 1 : 0.3);
    f.power += p * (D.powered[i] ? 1 : 0);
    w += p;
  }
  let landmark = 0, shrines = 0;
  for (let i = 0; i < NN; i++) {
    const t = S.type[i];
    if (t < 10 || S.owner[i] !== i || !B[t].approval) continue;
    if (B[t].key === 'shrine') { if (shrines++ < 3) landmark += 1; } else landmark += B[t].approval;
  }
  landmark = Math.min(15, landmark);
  if (!w) { ST.approval = clamp(55 + landmark - (S.tax.r - 7) * 2.5, 0, 100); ST.factors = null; ST.eq = 0; return; }
  for (const k in f) f[k] /= w;
  const base = 0.18 * f.emp + 0.12 * f.commute + 0.14 * f.poll + 0.12 * f.crime + 0.12 * f.health + 0.1 * f.edu + 0.1 * f.trash + 0.06 * f.water + 0.06 * f.power;
  ST.approval = clamp(base * 100 - (S.tax.r - 7) * 2.5 + landmark, 0, 100);
  ST.factors = f; ST.eq = f.edu; ST.landmark = landmark;
}

/* --- totals and growth --- */
function adjustTotals(i, t, L, s) {
  if (t === T.RES) ST.pop += s * POP[L];
  else if (t === T.COM) ST.jc += s * JOBS_C[L];
  else if (t === T.IND) { ST.ji += s * JOBS_I[L]; if (S.kind[i] && L) ST.ht += s; }
  else return;

}
function recountTotals() {
  ST.pop = ST.jc = ST.ji = ST.ht = ST.developed = 0;

}
const dayStamp = () => monthIndex() * 30 + S.day;
function setLevel(i, L, quiet) {
  const t = S.type[i], old = S.level[i];
  if (old === L) return;

  adjustTotals(i, t, old, -1);

}
function computeDemand() {
  const P = ST.pop, W = P * 0.5, outside = ST.hasEdge ? 300 + P * 0.06 : 0;

  const base = 120 + (ST.hasEdge ? 250 : 0);
  ST.dr = clamp((open - unemp + base) / Math.max(250, W * 0.25), -1, 1);
  const tC = P * 0.25 + ST.tourism * 0.4 + 20;
  ST.dc = clamp((tC - ST.jc) / Math.max(150, tC * 0.3), -1, 1);

}
function maxLevel(i, t, keep) {
  const a = D.acc[i], lv = D.lv[i] + (keep ? 15 : 0), poll = D.poll[i] - (keep ? 25 : 0);
  if (t === T.RES) {
    let m = lv < 30 ? 1 : lv < 90 ? 2 : lv < 150 ? 3 : 4;
    if (!D.watered[i]) m = Math.min(m, 1);
    if (poll > 130) m = 1; else if (poll > 70) m = Math.min(m, 2);
    if (m === 4 && (eqAt(i) < 0.5 || ST.pop < 15000)) m = 3;

    if (poll > 150) m = Math.min(m, 2);
    if (m === 4 && ST.pop < 30000) m = 3;
    return m;
  }
  let m = ST.pop < 1500 ? 2 : 3;
  if (!D.watered[i]) m = Math.min(m, 1);
  if (a < 0 || !compEdge[D.comp[a]]) m = Math.min(m, 1);
  return m;
}
function growTile(i) {
  const t = S.type[i], L = S.level[i], a = D.acc[i];
  if (S.fire[i]) return;
  if (a < 0 || !D.powered[i]) { if (L > 0 && rand() < 0.2) { noteDown(i); setLevel(i, L - 1, true); } return; }
  const now = dayStamp(), settled = now - D.lastUp[i] > 90, rested = now - D.lastDown[i] > 180;
  const c = D.comp[a];
  let dem, des, mult, ok = true, tax;
  let grow = true;
  if (t === T.RES) {
    if (L === 0 && !(compZJ[c] > 0 || compEdge[c])) return;
    dem = ST.dr; tax = S.tax.r;
    const emp = D.emp[a], cm = D.commute[a];
    if (L > 0 && emp < 0.4) ok = false;
    // new homes only where a vacant job can be reached (a brand-new network may start without one)
    if (!D.jobReach[a] && compJobs[c] > 0) grow = false;
    des = (D.lv[i] - 90) / 110 - D.poll[i] / 110 - D.crime[i] / 200 - S.trash[i] / 200 + svcAt('health', i) * 0.15 + eqAt(i) * 0.15 -
      Math.max(0, cm - 20) / 40 - (L > 0 && emp < 0.7 ? 0.3 : 0);
    mult = (0.3 + ST.approval / 100 * 1.2) * taxMult(tax);
  } else {
    if (L === 0 && !(compZR[c] > 0 || compEdge[c])) return;
    if (L > 0 && D.jfill[a] < 0.45) ok = false;
    if (!D.labReach[a] && compWorkers[c] > 0) grow = false;
    if (t === T.COM) { dem = ST.dc; tax = S.tax.c; des = (D.lv[i] - 80) / 130 - D.crime[i] / 250 - D.poll[i] / 220 - S.trash[i] / 250; }
    else { dem = ST.di; tax = S.tax.i; des = 0.2 - D.crime[i] / 400 - S.trash[i] / 400; }

  }

  if (L > maxLevel(i, t, true)) { if (settled && rand() < 0.15) { noteDown(i); setLevel(i, L - 1); } return; }

    const p = (0.05 + dem * clamp(0.55 + des * 0.5, 0.1, 1) * 0.6) * mult;
    if (rand() < p) {
      if (t === T.IND && !S.kind[i] && ST.eq > 0.35 && rand() < (ST.eq - 0.25) * 1.5) {
        adjustTotals(i, t, L, -1); S.kind[i] = 1; adjustTotals(i, t, L, 1);

    }
  } else if (L > 0 && settled && (dem < -0.25 || des < -0.8 || !ok || (t === T.RES && ST.approval < 30) || tax > 12)) {
    let p = 0.02 + Math.max(0, -dem) * 0.08 + Math.max(0, -0.8 - des) * 0.1 + (ok ? 0 : 0.03);
    if (t === T.RES && ST.approval < 30) p += (30 - ST.approval) * 0.004;
    if (tax > 12) p += (tax - 12) * 0.006;

}
/* why a lot is not growing, in plain words (for the inspector) */
function growthNotes(i) {

function blockTip(k, t) {

  let dem, tax, des, terms;
  // an empty lot in a zone nobody needs right now: that is the whole story
  if (L === 0 && (t === T.RES ? ST.dr : t === T.COM ? ST.dc : ST.di) <= 0) return 'demand';
  if (t === T.RES) {
    const emp = D.emp[a], cm = D.commute[a];
    if ((L > 0 && emp < 0.4) || (!D.jobReach[a] && compJobs[c] > 0)) return 'jobs';
    dem = ST.dr; tax = S.tax.r;
    terms = { lv: (D.lv[i] - 90) / 110, poll: -D.poll[i] / 110, crime: -D.crime[i] / 200, trash: -S.trash[i] / 200, commute: -Math.max(0, cm - 20) / 40, jobs: L > 0 && emp < 0.7 ? -0.3 : 0 };
    des = terms.lv + terms.poll + terms.crime + terms.trash + terms.commute + terms.jobs + svcAt('health', i) * 0.15 + eqAt(i) * 0.15;
  } else {
    if ((L > 0 && D.jfill[a] < 0.45) || (!D.labReach[a] && compWorkers[c] > 0)) return 'labor';
    if (t === T.COM) { dem = ST.dc; tax = S.tax.c; terms = { lv: (D.lv[i] - 80) / 130, crime: -D.crime[i] / 250, poll: -D.poll[i] / 220, trash: -S.trash[i] / 250 }; }
    else { dem = ST.di; tax = S.tax.i; terms = { crime: -D.crime[i] / 400, trash: -S.trash[i] / 400 }; }
    des = Object.values(terms).reduce((s, v) => s + v, t === T.IND ? 0.2 : 0);
  }
  if (des <= -0.6) {
    let worst = 'lv', w = Infinity;
    for (const k in terms) if (terms[k] < w) { w = terms[k]; worst = k; }
    return worst;
  }
  if (tax > 12) return 'tax';
  if (t === T.RES && ST.approval < 30) return 'approval';
  if (dem <= 0) return 'demand';
  const max = maxLevel(i, t), top = t === T.IND ? 3 : 4;
  if (L >= max) return L >= top ? 'top' : capWhy(i, t, L);
  if (dayStamp() - D.lastDown[i] <= 180) return 'wait';
  return 'grow';
}
function noteDown(i) {
  const k = blockOf(i);
  D.downWhy[i] = BLOCK_KEYS.indexOf(k === 'grow' || k === 'top' || k === 'wait' ? 'demand' : k);
  D.downAt[i] = dayStamp();
}
/* the reason that matters to the player: a lot that just shrank is shown with why it shrank */
function blockShown(i) {
  const k = blockOf(i);
  return k === 'wait' && dayStamp() - D.downAt[i] <= 180 ? BLOCK_KEYS[D.downWhy[i]] : k;
}
/* lots that are stuck, grouped by reason, most common first */
function blockSummary() {
  const by = {}, now = dayStamp();
  let flicker = 0;
  for (let i = 0; i < NN; i++) {
    const t = S.type[i];
    if (!isZone(t) || S.fire[i]) continue;
    const k = blockShown(i);
    if (now - D.downAt[i] <= 360 && now - D.lastUp[i] <= 360) flicker++;
    if (k === 'grow' || k === 'top' || k === 'wait') continue;
    const e = by[k] || (by[k] = { k, n: 0, tiles: [], types: {} });
    e.n++; e.tiles.push(i); e.types[t] = (e.types[t] || 0) + 1;
  }
  return { list: Object.values(by).sort((p, q) => q.n - p.n), flicker };
}

/* --- money --- */
function computeBudget() {
  const tr = S.tax.r / 100, tc = S.tax.c / 100, ti = S.tax.i / 100;
  let res = 0, com = 0, ind = 0, roads = 0, avenues = 0, bridges = 0, wires = 0, rTop = 0, cTop = 0, land = 0, free = 0, wet = 0;
  const cnt = {}, zones = { 3: 0, 4: 0, 5: 0 };
  const up = { transport: 0, police: 0, fire: 0, health: 0, edu: 0, garbage: 0, power: 0, water: 0, park: 0 };
  for (let i = 0; i < NN; i++) {
    const t = S.type[i], L = S.level[i];
    if (!owned(i)) continue;
    if (S.terrain[i]) { if (t === T.EMPTY) wet++; } else { land++; if (t === T.EMPTY) free++; }
    if (t === T.ROAD) { if (S.terrain[i]) bridges++; else if (L) avenues++; else roads++; }
    else if (t === T.WIRE) wires++;
    else if (isZone(t)) {
      zones[t]++;
      if (!L) continue;
      if (t === T.RES) { res += POP[L] * tr * (0.75 + D.lv[i] / 300); if (L === 4) rTop++; }
      else if (t === T.COM) { com += JOBS_C[L] * tc * 1.1; if (L === 4) cTop++; }
      else ind += JOBS_I[L] * ti * (S.kind[i] ? 1.6 : 1);
    } else if (t >= 10 && S.owner[i] === i) {
      cnt[t] = (cnt[t] || 0) + 1;
      const b = B[t];
      up[b.fund || (b.supply ? 'power' : b.water ? 'water' : 'park')] += b.upkeep * (b.fund ? S.fund[b.fund] / 100 : 1);
    }
  }
  up.transport += (roads * 0.25 + avenues * 0.6 + bridges * 2 + wires * 0.05) * S.fund.transport / 100;
  const loans = S.loans.reduce((s, l) => s + l.pay, 0);
  ST.inc = { res, com, ind, tourism: ST.tourism * 0.03 };
  ST.exp = { ...up, loans };
  const sum = o => Object.values(o).reduce((s, v) => s + v, 0);
  ST.incTotal = sum(ST.inc); ST.expTotal = sum(ST.exp);
  ST.net = Math.round(ST.incTotal) - Math.round(ST.expTotal);
  Object.assign(ST, { cnt, zones, roads, avenues, bridges, wires, rTop, cTop, land, free, wet });
}
const count = key => ST.cnt[BKEY[key]] || 0;

/* --- fire --- */
function fireStep() {
  let burning = 0;
  for (let y = actLo; y < actHi; y++) for (let i = y * N + actLo, e = y * N + actHi; i < e; i++) {
    if (!S.fire[i]) continue;
    if (!isZone(S.type[i]) || !S.level[i]) { S.fire[i] = 0; continue; }
    burning++;
    S.fire[i]++;
    const a = D.acc[i], prot = a >= 0 ? D.fireProt[a] : 0;
    if (prot > 0.05 && rand() < 0.1 + prot * 0.5) {
      S.fire[i] = 0;
      if (!S.seen.extinguish) { S.seen.extinguish = 1; toast('消防隊が火事を消し止めました。', { kind: 'good' }); }
      continue;
    }
    if (S.fire[i] > 9) { S.fire[i] = 0; setLevel(i, 0, true); continue; }
    if (rand() < 0.1 * (1 - prot)) {
      const d = (rand() * 4) | 0, x = i % N + DX[d], y = ((i / N) | 0) + DY[d];
      if (inb(x, y)) {
        const n = y * N + x, an = D.acc[n];
        if (isZone(S.type[n]) && S.level[n] > 0 && !S.fire[n] && rand() > (an >= 0 ? D.fireProt[an] : 0)) S.fire[n] = 1;
      }
    }
  }
  if (S.disasters && ST.developed > 30 && rand() < 0.004 + ST.developed * 0.000004) {
    for (let k = 0; k < 40; k++) {
      const i = (ownLo + ((rand() * (ownHi - ownLo)) | 0)) * N + ownLo + ((rand() * (ownHi - ownLo)) | 0);
      if (!isZone(S.type[i]) || !S.level[i] || S.fire[i]) continue;
      const a = D.acc[i], prot = a >= 0 ? D.fireProt[a] : 0;
      if (rand() > prot * 1.2) {
        S.fire[i] = 1;
        toast(prot > 0 ? '火事が発生しました！ 消防隊が向かっています。' : '火事が発生しました！ 消防署から道路で16マス以内なら、すぐに消し止められます。', { kind: 'bad', action: { label: '見る', fn: () => flyTo(i) } });
      }
      break;
    }
  }
  ST.burning = burning;
}

/* --- clock --- */
const flags = { power: true, maps: true };
function refreshAll() {
  markAll();
  computeStatic();
  recountTotals();
  computeAccess();
  computeUtilities();
  computeStamps();
  computeServices();
  computeTraffic();
  computeMaps(true);
  computeUtilities();
  computeServices();
  computeMaps(true);
  computeGarbage(false);
  computeApproval();
  computeDemand();
  computeBudget();
  flags.power = flags.maps = false;
}
function simDay() {
  S.rev++;
  computeAccess();
  if (flags.power) { computeUtilities(); flags.power = false; }
  if (flags.maps || S.day % 4 === 0) { computeMaps(); flags.maps = false; }
  if (S.day % 10 === 5) computeServices();
  if (S.day === 15) { computeTraffic(); computeDemand(); }
  for (let y = actLo; y < actHi; y++) for (let i = y * N + actLo, e = y * N + actHi; i < e; i++) if (isZone(S.type[i]) && rand() < 0.08) growTile(i);
  fireStep();
  S.day++;
  if (S.day > 30) { S.day = 1; endOfMonth(); }
  hudDirty = true; dirty = true;
  if (sheetKind === 'info' && rand() < 0.25) refreshSheet();
}
function endOfMonth() {
  const mi = monthIndex();
  S.wind = 0.6 + rand() * 0.7;
  computeAccess();
  computeUtilities();
  computeTraffic();
  computeServices();
  computeGarbage(true);
  computeApproval();
  computeDemand();
  computeBudget();
  S.money += ST.net;
  for (const l of S.loans) l.left--;
  S.loans = S.loans.filter(l => l.left > 0);
  S.streak = ST.net >= 0 ? S.streak + 1 : 0;
  S.fy.inc += Math.round(ST.incTotal); S.fy.exp += Math.round(ST.expTotal);
  S.month++;
  if (S.month > 12) { S.month = 1; S.year++; }
  S.history.push({ y: S.year, m: S.month, pop: ST.pop, money: Math.round(S.money), approval: Math.round(ST.approval) });
  if (S.history.length > 240) S.history.shift();
  if (S.month === 4) {
    const net = S.fy.inc - S.fy.exp;
    toast(`${S.year - 1}年度の決算：収入 ${yen(S.fy.inc)}、支出 ${yen(S.fy.exp)}、差し引き ${net >= 0 ? '+' : ''}${yen(net)}`, { kind: net >= 0 ? 'good' : 'warn', ttl: 6500 });
    S.fy = { inc: 0, exp: 0 };
  }
  for (let y = actLo; y < actHi; y++) for (let i = y * N + actLo, e = y * N + actHi; i < e; i++) {
    if (!isPlant(S.type[i]) || S.owner[i] !== i) continue;
    const b = B[S.type[i]], age = (mi + 1 - S.built[i]) / 12;
    if (Math.abs(age - (b.life - 1)) < 1 / 24) toast(`${b.name}が老朽化してきました。あと1年ほどで発電量が落ちはじめます。`, { kind: 'warn', action: { label: '見る', fn: () => flyTo(i) } });
  }
  checkRank();
  checkGoals();
  advise();
  checkTutorial();
  if (sheetKind === 'budget') refreshSheet();
  // the world is large: write it out at most every 20 seconds (and whenever the page is hidden)
  if (performance.now() - lastSave > 20000) save();
}

function rankIndex(pop) { let r = 0; for (let k = 0; k < RANKS.length; k++) if (pop >= RANKS[k].min) r = k; return r; }
function cityName() { return S.name + RANKS[S.rank].suffix; }
function checkRank() {
  const r = rankIndex(ST.pop);
  if (r <= S.rank) return;
  const before = cityName();
  S.rank = r;
  const opened = Object.keys(TOOLS).filter(k => (TOOLS[k].rank || 0) === r).map(k => TOOLS[k].name);
  toast(`おめでとうございます！ ${before}は人口${compact(RANKS[r].min)}人を超え、「${RANKS[r].label}」になりました。` + (opened.length ? `新しく建てられるもの：${opened.join('・')}` : ''), { kind: 'good', ttl: 9000 });
  buildToolbar();
}

function advise() {
  const plants = Object.keys(ST.cnt).filter(t => isPlant(+t)).length;
  const list = [];
  if (!plants) list.push(['plant', '発電所がありません。「インフラ」から発電所を建てて、道路でつなぎましょう。', 'warn']);
  else if (ST.power.use > ST.power.supply) list.push(['short', `電力が足りず停電しています（使用 ${num(ST.power.use)}／発電 ${num(ST.power.supply)}）。発電所を増やしましょう。`, 'bad']);
  else if (ST.power.use > ST.power.supply * 0.9) list.push(['short9', `電力に余裕がありません（${Math.round(ST.power.use / ST.power.supply * 100)}%）。次の発電所を準備しましょう。`, 'warn']);
  if (ST.pop > 300 && ST.unwatered > 5) list.push(['water', ST.water.supply ? `水が足りず断水している建物が${ST.unwatered}あります。給水塔を増やしましょう。` : '水道がないと家は大きくなれません。給水塔を建てて道路でつなぎましょう。', 'warn']);
  if (ST.noRoad > 4) list.push(['noroad', `道路に面していない区画が${ST.noRoad}マスあります。区画は道路のとなりでないと発展しません。`, 'warn']);
  if (ST.pop > 500 && ST.garbage.gen > ST.garbage.cap * 1.02) list.push(['trash', ST.garbage.cap ? 'ゴミ処理が追いついていません。処分場や焼却場を増やしましょう。' : 'ゴミを回収する施設がありません。ゴミ処分場を建てましょう。', 'warn']);
  if (ST.landfillLeft < 18) list.push(['landfill', `ゴミ処分場があと${Math.max(1, Math.round(ST.landfillLeft))}か月でいっぱいになります。新しい処分場か焼却場を用意しましょう。`, 'warn']);
  if (S.money < 0) list.push(['debt', '資金がマイナスです。税率や予算配分を見直すか、「市政」で借り入れを検討しましょう。', 'bad']);
  else if (ST.net < 0 && S.money < 5000) list.push(['deficit', `毎月 ${yen(-ST.net)} の赤字です。「市政」で税率や予算を見直しましょう。`, 'warn']);
  if (ST.jams > 8) list.push(['jam', `渋滞している道路が${ST.jams}か所あります。大通りへの拡幅、迂回路、バスや地下鉄で通勤を分散させましょう。`, 'warn']);
  if (ST.workers > 500 && unemploymentRate() > 0.15) list.push(['unemp', `失業率が${Math.round(unemploymentRate() * 100)}%です。道路でつながった商業地・工業地を増やしましょう。`, 'warn']);
  if (ST.jc + ST.ji > 500 && ST.jobFill < 0.75) {
    if (ST.jc + ST.ji > ST.workers * 1.05) list.push(['labor', `働き手が足りません（仕事 ${num(ST.jc + ST.ji)}人分に対し、働き手 ${num(ST.workers)}人）。住宅地を増やしましょう。住宅が育たないときは「調べる」で理由を確かめられます。`, 'info']);
    else if (unemploymentRate() > 0.08) list.push(['labor2', '仕事が空いているのに通えない住民がいます。職場が遠すぎるか、渋滞しています。道路の近道や大通りを検討しましょう。', 'info']);
  }
  if (ST.pollHigh > 6) list.push(['poll', '汚染のひどい住宅地があります。住民の健康と地価に響きます。工業地や発電所から離すか、公園を置きましょう。', 'warn']);
  if (ST.crimeHigh > 6) list.push(['crime', '治安の悪い地区があります。交番や警察署を道路の届く場所に建てましょう。', 'warn']);
  if (ST.approval < 40 && ST.pop > 1000) list.push(['approval', `支持率が${Math.round(ST.approval)}%に下がっています。「市政」→「統計」で不満の理由を確かめましょう。`, 'warn']);
  const nx = AREAS[S.area + 1];
  if (nx && ST.land > 0 && ST.free < ST.land * 0.25) {
    if (S.rank >= nx.rank) list.push(['land', `空き地が残り${Math.round(ST.free / ST.land * 100)}%です。隣の町村と合併すると、市域が${nx.size}×${nx.size}マスに広がります（${yen(nx.cost)}）。`, 'info', { label: '市域', fn: () => openSheet('budget', 'land') }]);
    else list.push(['land0', `空き地が少なくなってきました。${RANKS[nx.rank].label}になると隣の町村と合併して市域を広げられます。それまでは埋め立てや、地価を上げて建物を高くしましょう。`, 'info']);
  }
  const stuck = ST.pop > 500 && monthIndex() % 3 === 0 ? blockSummary() : null;
  if (stuck) {
    // only real blockers: height limits (land value, population) and missing demand are normal, and roads/power/water have their own messages
    const real = stuck.list.filter(e => !['lv', 'cond', 'demand', 'road', 'power', 'water'].includes(e.k));
    const top = real[0], total = real.reduce((n, e) => n + e.n, 0);
    if (top && total >= 12) {
      list.push(['stuck', `育ちが止まっている区画が${num(total)}マスあります。いちばん多い理由は「${BLOCKS[top.k].name}」（${num(top.n)}マス）です。`, 'info', { label: '見る', fn: () => showBlocked(top.k, top.tiles) }]);
    } else if (stuck.flicker >= Math.max(15, (ST.zones[T.RES] + ST.zones[T.COM] + ST.zones[T.IND]) * 0.04)) {
      list.push(['flicker', `この1年で、建っては小さくなった区画が${num(stuck.flicker)}マスあります。理由はマップ表示「発展の妨げ」で確かめられます。`, 'info', { label: '表示', fn: () => setOverlay('block') }]);
    }
  }
  if (ST.pop > 1200 && !count('fire')) list.push(['firest', '消防署がありません。火事に備えましょう。', 'info']);
  if (ST.pop > 1500 && !count('school')) list.push(['school', '子どもが増えてきました。小学校を建てると地価と教育水準が上がります。', 'info']);
  if (ST.pop > 2500 && !count('clinic') && !count('hosp')) list.push(['clinic', '診療所がありません。医療は住民の満足度に大きく影響します。', 'info']);
  if (ST.dr > 0.5) list.push(['dr', '住宅の需要が高まっています。道路ぞいに住宅地を増やしましょう。', 'info']);
  if (ST.dc > 0.5 && ST.pop > 300) list.push(['dc', '商業の需要が高まっています。商業地を増やしましょう。', 'info']);
  if (ST.di > 0.5) list.push(['di', '工業の需要が高まっています。住宅から離れた場所に工業地を増やしましょう。', 'info']);
  const m = monthIndex();
  for (const [k, msg, kind, action] of list) {
    if ((S.seen[k] ?? -99) + 3 <= m) { S.seen[k] = m; toast(msg, { kind, action, ttl: action ? 8000 : undefined }); break; }
  }
}

/* line tools always run straight along one axis */
function lockLine(d) {
  if (Math.abs(d.bx - d.ax) >= Math.abs(d.by - d.ay)) d.by = d.ay; else d.bx = d.ax;
}
function linePts(ax, ay, bx, by) {
  const pts = [];

const ARR8 = ['terrain', 'tree', 'type', 'level', 'variant', 'fire', 'kind', 'trash'];

/* ---------------------------------------------------------
   アカウントへの保存。ブラウザの保存は Safari などで消えることがあるため、

    cloud.allowReplace = true;
    cloudSaveNow();
    toast(`いまの街を${whereName()}に保存します。前の保存データは${whereName()}内にバックアップします。`, { kind: 'good', ttl: 7000 });
  }
  refreshMenu();
}

/* ---------------------------------------------------------
   Firebase：匿名アカウントで自動保存し、引き継ぎID（12文字）とパスワードで別の端末からログインする。
   引き継ぎIDは Firebase のメール／パスワード認証のメール欄に「<id>@<authDomain>」として入れるだけで、
   メールは送らない。保存先は saves/<uid>/slots/city（と backup）。
   --------------------------------------------------------- */
const FB = { sdk: null, auth: null, fs: null, domain: '' };
const fbSlot = name => FB.sdk.doc(FB.fs, 'saves', cloud.uid, 'slots', name);
const ID_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newTransferId() {
  const r = new Uint8Array(12);
  crypto.getRandomValues(r);
  return Array.from(r, v => ID_CHARS[v % 32]).join('');
}
const formatId = id => id.replace(/(.{4})(?=.)/g, '$1-');
const cleanId = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const idEmail = id => `${id.toLowerCase()}@${FB.domain}`;
function idFromUser(u) {
  const m = u && u.email ? /^([a-z0-9]{12})@(.+)$/.exec(u.email) : null;
  return m && m[2] === FB.domain ? m[1].toUpperCase() : null;
}
async function firebaseInit(cfg) {
  let sdk;
  try { sdk = await import('./firebase-sdk.js'); } catch (e) { return false; }   // opened as a local file, or offline
  const app = sdk.initializeApp(cfg);
  const auth = sdk.initializeAuth(app, { persistence: [sdk.indexedDBLocalPersistence, sdk.browserLocalPersistence] });
  const fs = sdk.getFirestore(app);
  if (cfg.emulator) {
    sdk.connectAuthEmulator(auth, cfg.emulator.auth, { disableWarnings: true });
    sdk.connectFirestoreEmulator(fs, cfg.emulator.host, cfg.emulator.port);
  }
  Object.assign(FB, { sdk, auth, fs, domain: (cfg.authDomain || cfg.projectId + '.firebaseapp.com').toLowerCase() });
  // the sign-in kept by this browser, or a new anonymous one
  let user = await new Promise(res => { const off = sdk.onAuthStateChanged(auth, u => { off(); res(u); }); });
  if (!user) user = (await sdk.signInAnonymously(auth)).user;
  cloud.kind = 'firebase'; cloud.uid = user.uid; cloud.transferId = idFromUser(user);
  return true;
}
const AUTH_MSG = {
  'auth/invalid-credential': '引き継ぎIDかパスワードがちがいます。',
  'auth/wrong-password': '引き継ぎIDかパスワードがちがいます。',
  'auth/user-not-found': '引き継ぎIDかパスワードがちがいます。',
  'auth/invalid-email': '引き継ぎIDは12文字の英数字です。',
  'auth/weak-password': 'パスワードは8文字以上にしてください。',
  'auth/too-many-requests': '試行回数が多すぎます。しばらく待ってから試してください。',
  'auth/network-request-failed': 'サーバーにつながりませんでした。通信環境を確かめてください。',
  'auth/operation-not-allowed': 'サーバーの設定（メール／パスワードのログイン）が有効になっていません。管理者に連絡してください。',
  'auth/admin-restricted-operation': 'サーバーの設定（匿名ログイン）が有効になっていません。管理者に連絡してください。',
};
const authMsg = e => AUTH_MSG[e && e.code] || 'うまくいきませんでした。時間をおいて試してください。';
/* give this device's account a transfer ID: the anonymous account keeps its uid, so its saves stay */
async function issueTransferId(id, password) {
  if (password.length < 8) throw { code: 'auth/weak-password' };
  const user = FB.auth.currentUser;
  if (!user) throw { code: 'auth/network-request-failed' };
  await FB.sdk.linkWithCredential(user, FB.sdk.EmailAuthProvider.credential(idEmail(id), password));
  cloud.transferId = id;
  cloudSaveNow();
}
/* sign in with a transfer ID on this device and carry on from that city */
async function signInTransfer(rawId, password) {
  const id = cleanId(rawId);
  if (id.length !== 12) throw { code: 'auth/invalid-email' };
  const { user } = await FB.sdk.signInWithEmailAndPassword(FB.auth, idEmail(id), password);
  cloud.ready = false; cloud.hold = null; cloud.queued = null; cloud.allowReplace = false;
  cloud.uid = user.uid; cloud.transferId = id;
  await cloudSync(true);
  if (!cloud.hold && started) toast(`引き継ぎID ${formatId(id)} でログインしました。`, { kind: 'good' });
}

/* ---------------------------------------------------------
   書き出し・読み込み：保存データをファイルにして、別のブラウザや端末へ移す
   --------------------------------------------------------- */
async function exportSave() {
  let str;
  try { str = serialize(); } catch (e) { toast('書き出せませんでした。', { kind: 'bad' }); return; }
  const d = new Date(), two = v => String(v).padStart(2, '0');
  const filename = `tenohira-${S.name}-${d.getFullYear()}${two(d.getMonth() + 1)}${two(d.getDate())}.json`;
  let dl = null;
  try { dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: str }); toast('保存データを書き出しました。別の端末では「ファイルから読み込む」で続きから遊べます。', { kind: 'good', ttl: 7000 }); }
    catch (e) { if (!e || e.code !== 'declined') toast('この画面では書き出せませんでした。', { kind: 'warn' }); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([str], { type: 'application/json' }));
  a.download = filename;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
let pendingImport = null;
function importSave() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json,text/plain';
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    try { pendingImport = deserialize(await f.text()); } catch (e) { pendingImport = null; toast('このファイルは「てのひら都市」の保存データとして読み込めませんでした。', { kind: 'bad' }); return; }
    openSheet('menu');
  });
  inp.click();
}
function confirmImport(yes) {
  const loaded = pendingImport;
  pendingImport = null;
  if (yes && loaded) {
    keepCopy('before-import', storageGet(), true);
    cloud.allowReplace = true; cloud.hold = null;
    applyLoaded(loaded);
    save();
    cloudSaveNow();
    toast(`${describeSave(loaded.state)}を読み込みました。`, { kind: 'good' });
  }
  if (sheetKind === 'menu') refreshSheet();
}
/* =========================================================
   起動
   ========================================================= */
function newMap(seed, name) {
  S = blankState(seed, name);
  setArea(0);
  genTerrain(seed);
  placeHighway(seed);
  undoStack.length = 0; cars.length = 0;
  refreshAll();
  roadListDirty = true; dirty = true; hudDirty = true;
}
function fitCamera() {
  const w = $('#welcome'), cover = w.hidden ? 0 : w.offsetHeight + 16;
  const availH = Math.max(160, vh - cover - 24);
  const n = AREAS[S.area].size;
  cam.z = clamp(Math.min((vw - 16) / (n * HW * 2), availH / (n * HH * 2 + 40)), ZMIN, 0.5);
  cam.x = 0;
  cam.y = N * HH + 13 + (vh / 2 - (vh - cover) / 2) / cam.z;
  dirty = true;
}
function showWelcome() {
  document.body.classList.add('intro');
  started = false; setSpeed(0);
  const w = $('#welcome');
  w.hidden = false;
  const inp = $('#city-name');
  inp.value = S.name;
  fitCamera();
}
function startNew() {
  const seed = (Math.random() * 2 ** 31) | 0;
  newMap(seed, NAMES[(Math.random() * NAMES.length) | 0]);
  showWelcome();
}
function beginGame() {
  const name = $('#city-name').value.trim() || S.name;
  S.name = name.slice(0, 8);
  $('#welcome').hidden = true;
  document.body.classList.remove('intro');
  started = true;
  resize();
  selectTool('select');
  setSpeed(1);
  // land at the inner end of the national road
  let best = (N / 2) * N + N / 2, bestScore = -1;
  for (let i = 0; i < NN; i++) {
    if (!isRoad(i)) continue;
    const x = i % N, y = (i / N) | 0, s = Math.min(x, y, N - 1 - x, N - 1 - y);
    if (s > bestScore) { bestScore = s; best = i; }
  }
  flyTo(best, clamp(vw / 520, 0.7, 1.1));
  S.history = [{ y: S.year, m: S.month, pop: 0, money: S.money, approval: 50 }];
  renderTutorial();
  hudDirty = true;
  save();
}

let lastFrame = performance.now(), acc = 0, lastRender = 0, lastHud = 0;
function frame(now) {
  const dt = Math.min(100, now - lastFrame);
  lastFrame = now;
  stepTween(now);
  keyPan(dt);
  if (started && speed > 0) {
    acc += dt;
    const dayMs = [0, 400, 150, 50][speed];
    let n = 0;
    while (acc >= dayMs && n < 6) { acc -= dayMs; simDay(); n++; }
    if (n >= 6) acc = 0;
  }
  if (started) updateCars(dt);
  const animating = (started && speed > 0 && lod > 0) || ST.burning > 0 || floaters.length > 0 || (lod > 0 && (ST.unpowered > 0 || ST.noRoad > 0 || windFx.length > 0));
  if (dirty || (animating && now - lastRender > 33)) {
    render(now);
    dirty = false; lastRender = now;
  }
  if (hudDirty && now - lastHud > 100 && S) { updateHUD(); hudDirty = false; lastHud = now; }
  requestAnimationFrame(frame);
}

function bindUI() {
  $('#btn-speed').addEventListener('click', () => setSpeed((speed + 1) % 4));
  $('#btn-layer').addEventListener('click', () => (sheetKind === 'layers' ? closeSheet() : openSheet('layers')));
  $('#btn-budget').addEventListener('click', () => (sheetKind === 'budget' ? closeSheet() : openSheet('budget')));
  $('#btn-undo').addEventListener('click', undo);
  $('#btn-menu').addEventListener('click', () => { confirmNew = false; sheetKind === 'menu' ? closeSheet() : openSheet('menu'); });
  $('#sheet-close').addEventListener('click', closeSheet);
  $('#hud-status').addEventListener('click', () => (sheetKind === 'budget' && sheetArg === 'stats' ? closeSheet() : openSheet('budget', 'stats')));
  new ResizeObserver(resize).observe($('#hud'));
  $('#btn-reroll').addEventListener('click', () => {
    const name = $('#city-name').value.trim() || S.name;
    newMap((Math.random() * 2 ** 31) | 0, name);
    fitCamera();
  });
  $('#btn-start').addEventListener('click', beginGame);
  $('#city-name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  new ResizeObserver(resize).observe($('#dock'));
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); cloudSave(null, true); } });
  window.addEventListener('pagehide', () => { save(); cloudSave(null, true); });
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

/* switch the running game over to a loaded save (from this browser, the account or a file) */
function applyLoaded(loaded) {
  S = loaded.state;
  setArea(S.area || 0);
  undoStack.length = 0; cars.length = 0;
  closeSheet();
  refreshAll();
  buildToolbar();
  $('#welcome').hidden = true;
  document.body.classList.remove('intro');
  started = true;
  resize();
  if (loaded.cam) { cam.x = loaded.cam.x; cam.y = loaded.cam.y; cam.z = loaded.cam.z; clampCam(); }
  selectTool('select');
  setSpeed(clamp(loaded.speed || 1, 1, 3));
  renderTutorial();
  roadListDirty = true; blkGen++; dirty = true; hudDirty = true;
}
function boot() {
  bindUI();
  readTheme();
  resize();
  let loaded = null;
  const raw = storageGet();
  if (raw) {
    try { loaded = deserialize(raw); } catch (e) { loaded = null; }
    // never let a new game overwrite a save that would not load
    if (!loaded) keepCopy('unreadable', raw);
    else if (loaded.old) keepCopy('v' + (JSON.parse(raw).v || 1), raw);
  }
  if (loaded) {
    applyLoaded(loaded);
    if (loaded.grown) toast('新しいバージョンになりました。街のまわりに隣の町村が加わり、「市政」→「市域」で合併すると土地を広げられます。育たない区画の理由は「市政」→「統計」と、マップ表示「発展の妨げ」で確かめられます。', { kind: 'info', ttl: 14000 });
    else if (loaded.migrated) toast('新しいバージョンになりました。区画は道路に面している必要があり、住民は道路で通勤します。水道とゴミ処理も加わりました。「市政」→「目標」も見てみましょう。', { kind: 'info', ttl: 12000 });
    else toast(`おかえりなさい。${cityName()}の${S.year}年${S.month}月から再開します。`);
  } else {
    newMap((Math.random() * 2 ** 31) | 0, NAMES[(Math.random() * NAMES.length) | 0]);
    buildToolbar();
    showWelcome();
    if (raw) toast('保存データを読み込めませんでした。データはこの端末に別に残してあります。', { kind: 'bad', ttl: 10000 });
  }
  cloudInit();
  updateHint();
  hudDirty = true;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dirty = true; resize(); });
  requestAnimationFrame(t => { lastFrame = t; frame(t); });
}

boot();

/* debugging / automated checks */
window.__city = {
  get S() { return S; }, ST, D, T, B, BKEY, TOOLS, GOALS, cam, simDay, makePlan, applyPlan, render, refreshAll, setSpeed, selectTool, beginGame, setOverlay,
  computeTraffic, computeServices, computeGarbage, computeUtilities, computeApproval, serialize, deserialize, openSheet, growthNotes, blockOf, blockShown, blockSummary, BLOCKS, BLOCK_KEYS, showBlocked, closeSheet, setArea, expandArea, AREAS, owned, cloud, exportSave, applyLoaded, issueTransferId, signInTransfer, newTransferId, FB, get ownLo() { return ownLo; },
  run(days) { for (let k = 0; k < days; k++) simDay(); },
  place(tid, ax, ay, bx = ax, by = ay) { return applyPlan(tid, makePlan(tid, { ax, ay, bx, by })); },
};
})();
</script>
