<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>てのひら都市</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="スマホのブラウザで遊べる都市づくりシミュレーション。道路を引き、区画を指定して、村を政令指定都市まで育てよう。">
<meta name="theme-color" content="#d9e4e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1519" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="てのひら都市">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: the board fills the screen; a HUD strip floats on top, the tool dock sits at the bottom, sheets rise above the dock. */
:root {
  --bg: #d9e4e8;
  --panel: #fbfcfc;
  --panel-2: #edf1f3;
  --ink: #17212b;
  --muted: #5b6977;
  --line: rgba(23, 33, 43, .13);
  --accent: #0a5fc0;
  --accent-ink: #ffffff;
  --accent-soft: #dbe8fa;
  --res: #2f9655;
  --com: #d4466b;
  --ind: #4766cc;
  --good: #2b8a3e;
  --warn: #b85600;
  --bad: #c92a2a;
  --shadow: 0 1px 2px rgba(15, 25, 35, .10), 0 6px 18px rgba(15, 25, 35, .10);
  --f-display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --dock-h: 106px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1519; --panel: #182027; --panel-2: #222c34; --ink: #e5ecf1; --muted: #9aa8b5;
    --line: rgba(229, 236, 241, .13); --accent: #5ea6ff; --accent-ink: #06121f; --accent-soft: #1b3352;
    --res: #4cc27a; --com: #ff7d9d; --ind: #8aa4ff; --good: #5cc27a; --warn: #ffa94d; --bad: #ff6b6b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1519; --panel: #182027; --panel-2: #222c34; --ink: #e5ecf1; --muted: #9aa8b5;
  --line: rgba(229, 236, 241, .13); --accent: #5ea6ff; --accent-ink: #06121f; --accent-soft: #1b3352;
  --res: #4cc27a; --com: #ff7d9d; --ind: #8aa4ff; --good: #5cc27a; --warn: #ffa94d; --bad: #ff6b6b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

html {
  box-sizing: border-box;
  height: 100%;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: var(--bg);
  overflow: hidden;
  overscroll-behavior: none;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--f-body);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- HUD ---------- */
.hud {
  position: absolute; top: 8px; left: 8px; right: 8px; max-width: 620px; margin: 0 auto;
  display: flex; align-items: stretch;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  overflow: hidden; z-index: 5;
}
.seg {
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
  padding: 5px 10px; min-width: 0; overflow: hidden; border: 0; border-right: 1px solid var(--line); background: none; text-align: left;
}
.seg:last-child { border-right: 0; }
.seg .k { font-size: 10px; line-height: 1.2; color: var(--muted); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg .v { font: 400 16px/1.15 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg .d { font-size: 10px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.seg .d.up { color: var(--good); }
.seg .d.down { color: var(--bad); }
.seg-money { flex: 1.25 1 0; }
.seg-pop { flex: 1 1 0; }
.seg-date { flex: 0 0 auto; }
.v.neg { color: var(--bad); }
.seg-rci { flex: 0 0 auto; flex-direction: row; align-items: stretch; gap: 5px; padding: 5px 8px; }
.rci-col { display: grid; grid-template-rows: 1fr auto; justify-items: center; gap: 2px; }
.rci-bar { position: relative; width: 8px; height: 28px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.rci-bar::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.rci-bar i { position: absolute; left: 0; right: 0; height: 0; border-radius: 2px; }
.rci-col b { font-size: 9px; line-height: 1; font-weight: 700; color: var(--muted); }
.rci-r i { background: var(--res); } .rci-c i { background: var(--com); } .rci-i i { background: var(--ind); }
.seg-speed { flex: 0 0 auto; align-items: center; width: 52px; padding: 4px 6px; color: var(--ink); }
.seg-speed svg { width: 22px; height: 18px; fill: currentColor; }
.seg-speed .k { text-align: center; }
.seg-speed[data-speed="0"] { color: var(--warn); }

/* ---------- side buttons ---------- */
.side {
  position: absolute; right: 8px; top: 74px; display: flex; flex-direction: column; gap: 8px; z-index: 4;
}
.side button {
  width: 50px; height: 50px; display: grid; place-items: center; align-content: center; gap: 1px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); padding: 0;
}
.side button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.side button span { font-size: 10px; line-height: 1; font-weight: 700; }
.side button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.side button:disabled { opacity: .4; cursor: default; }

/* ---------- legend ---------- */
.legend {
  position: absolute; left: 8px; right: 66px; top: 74px; z-index: 4; max-width: 440px; margin: 0 auto;
  display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); font-size: 11px;
}
.legend h3 { margin: 0; font-size: 12px; white-space: nowrap; }
.legend .lo, .legend .hi { color: var(--muted); white-space: nowrap; }
.legend .ramp { flex: 1; min-width: 40px; display: flex; height: 10px; border-radius: 3px; overflow: hidden; }
.legend .ramp i { flex: 1; }
.legend .keys { flex: 1; display: flex; gap: 12px; }
.legend .keys span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend .keys i { width: 12px; height: 12px; border-radius: 3px; }
.legend .x { flex: 0 0 auto; width: 26px; height: 26px; border: 0; border-radius: 8px; background: var(--panel-2); font-size: 15px; line-height: 1; padding: 0; }
.legend:not([hidden]) ~ .toasts { top: 120px; }

/* ---------- toasts ---------- */
.toasts {
  position: absolute; top: 74px; left: 8px; right: 66px; max-width: 440px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 6px; z-index: 6; pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; pointer-events: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  font-size: 13px; line-height: 1.45; animation: toast-in .22s ease-out;
}
.toast .dot { flex: 0 0 auto; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--accent); }
.toast.warn .dot { background: var(--warn); }
.toast.bad .dot { background: var(--bad); }
.toast.good .dot { background: var(--good); }
.toast p { margin: 0; flex: 1; min-width: 0; }
.toast button { flex: 0 0 auto; border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 8px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* ---------- tutorial ---------- */
.tut {
  position: absolute; left: 8px; bottom: calc(var(--dock-h) + 8px); z-index: 4; width: 236px; max-width: calc(100% - 80px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
}
.tut-head { display: flex; align-items: center; gap: 6px; padding: 8px 6px 8px 12px; }
.tut-head button.title { flex: 1; text-align: left; border: 0; background: none; padding: 0; font-weight: 700; font-size: 13px; }
.tut-head .count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tut-head .x { border: 0; background: none; width: 28px; height: 28px; border-radius: 8px; color: var(--muted); font-size: 18px; line-height: 1; }
.tut ol { list-style: none; margin: 0; padding: 0 12px 10px; display: flex; flex-direction: column; gap: 5px; }
.tut li { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 1.35; }
.tut li i { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 10px; }
.tut li.done { color: var(--muted); }
.tut li.done i { background: var(--good); border-color: var(--good); color: #fff; }
.tut li.done span { text-decoration: line-through; }
.tut.min ol { display: none; }
.tut-next { display: none; padding: 0 12px 10px; font-size: 12px; line-height: 1.45; }
.tut-next b { display: block; font-size: 13px; }
.tut-next span { color: var(--muted); }
.tut.min .tut-next { display: block; }
.tut.min .tut-head { padding-bottom: 2px; }

/* ---------- dock ---------- */
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(15, 25, 35, .08);
  padding: 5px 0 8px;
}
.hint {
  display: flex; align-items: center; gap: 8px; min-height: 20px;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) 4px max(12px, env(safe-area-inset-left, 0px));
  font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden;
}
.hint b { color: var(--ink); }
.hint span { overflow: hidden; text-overflow: ellipsis; }
.hint .cost { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }
.hint .cost.bad { color: var(--bad); }
.hint .cost.muted { font-weight: 400; color: var(--muted); flex: 0 0 auto; }
.tools {
  display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  padding: 0 10px; scroll-padding: 0 10px; touch-action: pan-x; overscroll-behavior-x: contain;
}
.tools::-webkit-scrollbar { display: none; }
.tools .sep { flex: 0 0 1px; align-self: stretch; margin: 6px 2px; background: var(--line); }
.tool {
  position: relative; flex: 0 0 auto; width: 64px; height: 72px; padding: 3px 2px 4px;
  display: grid; grid-template-rows: 38px auto auto; justify-items: center; align-content: center;
  border-radius: 12px; border: 1.5px solid transparent; background: var(--panel-2);
}
.tool canvas, .tool svg { width: 48px; height: 36px; align-self: end; }
.tool svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; padding: 4px 8px 2px; }
.tool .nm { font-size: 11px; font-weight: 700; line-height: 1.25; white-space: nowrap; }
.tool .pr { font-size: 10px; line-height: 1.2; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.tool.poor .pr { color: var(--bad); }
.tool[data-zone]::after { content: ""; position: absolute; left: 14px; right: 14px; top: 3px; height: 3px; border-radius: 2px; background: var(--zc); }

/* ---------- sheets ---------- */
.sheet {
  position: absolute; left: 8px; right: 8px; bottom: calc(var(--dock-h) + 8px); z-index: 7;
  max-width: 520px; margin: 0 auto; max-height: calc(100% - var(--dock-h) - 82px);
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  animation: sheet-in .2s ease-out;
}
@keyframes sheet-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.sheet > header { display: flex; align-items: center; gap: 8px; padding: 10px 8px 6px 16px; border-bottom: 1px solid var(--line); }
.sheet h2 { flex: 1; margin: 0; font: 400 17px/1.3 var(--f-display); text-wrap: balance; }
.sheet .close { width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--panel-2); font-size: 20px; line-height: 1; }
.sheet-body { overflow-y: auto; padding: 12px 16px 16px; touch-action: pan-y; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px; }
.sheet section h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; padding-left: 12px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.kv .sum { border-top: 1px solid var(--line); padding-top: 5px; margin-top: 2px; }
.kv .pos { color: var(--good); } .kv .neg { color: var(--bad); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.tag.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); font-weight: 700; }
.reasons { margin: 0; padding-left: 1.2em; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.meter { position: relative; height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--accent); }
.meter.over i { background: var(--bad); }
.meter-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input { flex: 1; accent-color: var(--accent); height: 28px; }
.slider-row output { font: 400 20px/1 var(--f-display); min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
.note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
.btn {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }
.layer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.layer-grid button { padding: 10px 6px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel-2); font-weight: 700; font-size: 13px; }
.layer-grid button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.switch-row input { width: 22px; height: 22px; accent-color: var(--accent); }
.name-row { display: flex; align-items: center; gap: 8px; }
.name-row input {
  flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
  font-size: 16px; -webkit-user-select: text; user-select: text;
}
.name-row .suffix { font: 400 18px/1 var(--f-display); }
.help { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.6; }
.confirm { padding: 12px; border-radius: 12px; background: color-mix(in srgb, var(--bad) 10%, transparent); display: flex; flex-direction: column; gap: 10px; font-size: 13px; }

/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .ch-grid { stroke: var(--line); stroke-width: 1; }
.chart .ch-zero { stroke: var(--muted); stroke-width: 1; opacity: .5; }
.chart .ch-area { fill: var(--accent); fill-opacity: .1; }
.chart .ch-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ch-dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.chart .ch-txt { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.chart .ch-end { fill: var(--ink); font-size: 11px; font-weight: 700; font-family: var(--f-body); }
.chart .ch-cross { stroke: var(--muted); stroke-width: 1; }
.chart .tip {
  position: absolute; top: 0; pointer-events: none; padding: 4px 8px; border-radius: 8px; white-space: nowrap;
  background: var(--ink); color: var(--panel); font-size: 11px; font-variant-numeric: tabular-nums; transform: translateX(-50%);
}
.chart .empty { margin: 0; padding: 18px 0; text-align: center; font-size: 12px; color: var(--muted); }

/* ---------- welcome ---------- */
.welcome {
  position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 9; max-width: 460px; margin: 0 auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px;
}
.welcome .eyebrow { margin: 0; font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.welcome h1 { margin: -4px 0 0; font: 400 30px/1.15 var(--f-display); letter-spacing: .02em; }
.welcome p.lead { margin: 0; font-size: 14px; line-height: 1.6; }
.welcome label { font-size: 12px; font-weight: 700; color: var(--muted); }
.welcome .zones { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.welcome .zones span { display: inline-flex; align-items: center; gap: 5px; }
.welcome .zones i { width: 10px; height: 10px; border-radius: 3px; }
body.intro .dock, body.intro .side, body.intro .hud, body.intro .tut { visibility: hidden; }

@media (prefers-reduced-motion: reduce) {
  .toast, .sheet { animation: none; }
  .toast.out { transition: none; }
}
@media (min-width: 700px) {
  .tools { justify-content: safe center; }
}
@media (max-height: 520px) {
  .side { top: 66px; gap: 6px; }
  .side button { width: 44px; height: 44px; border-radius: 12px; }
  .side button span { display: none; }
  .legend { top: 66px; }
  .toasts { top: 66px; }
  .legend:not([hidden]) ~ .toasts { top: 110px; }
  .tut.min .tut-next span { display: none; }
}
.welcome { max-height: calc(100% - 16px); overflow-y: auto; }
</style>
</head>
<body class="intro">
<div id="app">
  <canvas id="view" aria-label="都市の地図"></canvas>

  <header class="hud" id="hud">
    <div class="seg seg-money"><span class="k">資金</span><span class="v" id="hud-money">¥0</span><span class="d" id="hud-net">±¥0／月</span></div>
    <div class="seg seg-pop"><span class="k" id="hud-city">—</span><span class="v" id="hud-pop">0</span><span class="d">人口</span></div>
    <div class="seg seg-date"><span class="k" id="hud-year">—</span><span class="v" id="hud-month">—</span><span class="d" id="hud-day">1日</span></div>
    <div class="seg seg-rci" id="hud-rci" title="需要（住宅・商業・工業）">
      <div class="rci-col rci-r"><div class="rci-bar"><i></i></div><b>住</b></div>
      <div class="rci-col rci-c"><div class="rci-bar"><i></i></div><b>商</b></div>

/* =========================================================
   ユーティリティ
   ========================================================= */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
const rand = Math.random;
const yen = n => (n < 0 ? '−¥' : '¥') + Math.abs(Math.round(n)).toLocaleString('ja-JP');
const num = n => Math.round(n).toLocaleString('ja-JP');
function compact(n) {
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e8) return s + (a / 1e8).toFixed(a >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '億';
  if (a >= 1e4) return s + (a / 1e4).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, '') + '万';
  return s + num(a);
}
const $ = s => document.querySelector(s);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) {
  const c = v => clamp(Math.round(v), 0, 255);
  return '#' + ((1 << 24) | (c(r) << 16) | (c(g) << 8) | c(b)).toString(16).slice(1);
}
function shade(h, f) {
  const [r, g, b] = hexToRgb(h);

}
const palCache = new Map();
function pal(h) {

}

}
function unb64(str) {

}
const inb = (x, y) => x >= 0 && y >= 0 && x < N && y < N;

/* =========================================================

let S = null;
function blankState(seed, name) {

  };

const D = {
  powered: new Uint8Array(NN), access: new Uint8Array(NN), lv: new Uint8Array(NN), poll: new Uint8Array(NN),
  crime: new Uint8Array(NN), traffic: new Uint8Array(NN), shallow: new Uint8Array(NN), beach: new Uint8Array(NN),

/* =========================================================
   地形生成
   ========================================================= */
function genTerrain(seed) {
  const r = mulberry32(seed);
  const terrain = S.terrain, tree = S.tree;
  terrain.fill(0); tree.fill(0);
  const mk = g0 => {
    const W = g0 + 2, g = new Float32Array(W * W);
    for (let k = 0; k < g.length; k++) g[k] = r();
    return (x, y) => {
      const xi = x | 0, yi = y | 0, fx = x - xi, fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const a = g[yi * W + xi], b = g[yi * W + xi + 1], c = g[(yi + 1) * W + xi], d = g[(yi + 1) * W + xi + 1];
      return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    };
  };
  const h1 = mk(4), h2 = mk(8), h3 = mk(16), t1 = mk(6), t2 = mk(12);
  const sea = 0.27 + r() * 0.06;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = x / N, v = y / N, i = y * N + x;
    let h = h1(u * 4, v * 4) * 0.55 + h2(u * 8, v * 8) * 0.3 + h3(u * 16, v * 16) * 0.15;
    h += (0.36 - Math.hypot(u - 0.5, v - 0.5)) * 0.3;
    if (h < sea) terrain[i] = 1;
    const tv = t1(u * 6, v * 6) * 0.65 + t2(u * 12, v * 12) * 0.35;
    if (!terrain[i] && tv > 0.6) tree[i] = 1;
  }
  if (r() < 0.75) {
    const horiz = r() < 0.5;
    let p = N * 0.25 + r() * N * 0.5, dir = (r() - 0.5) * 0.6;
    for (let s = -2; s < N + 2; s++) {
      dir = clamp(dir + (r() - 0.5) * 0.35, -0.7, 0.7);
      p += dir;
      if (p < 4) { p = 4; dir = Math.abs(dir); }
      if (p > N - 6) { p = N - 6; dir = -Math.abs(dir); }
      if (s < 0 || s >= N) continue;
      const q = Math.floor(p);
      for (let k = 0; k < 2; k++) {
        const x = horiz ? s : q + k, y = horiz ? q + k : s, i = y * N + x;
        terrain[i] = 1; tree[i] = 0;
      }
    }
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    if (!terrain[i]) continue;
    let w = 0;
    for (let d = 0; d < 4; d++) { const nx = x + DX[d], ny = y + DY[d]; if (inb(nx, ny) && terrain[ny * N + nx]) w++; }
    if (w === 0) terrain[i] = 0;
  }
}

function computeStatic() {
  const dist = new Uint8Array(NN).fill(255), q = new Int32Array(NN);
  let qh = 0, qt = 0;
  for (let i = 0; i < NN; i++) if (S.terrain[i]) { dist[i] = 0; q[qt++] = i; }
  while (qh < qt) {
    const c = q[qh++], cx = c % N, cy = (c / N) | 0;
    if (dist[c] >= 5) continue;
    for (let d = 0; d < 4; d++) {
      const nx = cx + DX[d], ny = cy + DY[d];
      if (!inb(nx, ny)) continue;
      const n = ny * N + nx;
      if (dist[n] > dist[c] + 1) { dist[n] = dist[c] + 1; q[qt++] = n; }
    }
  }
  const bonus = [0, 45, 36, 26, 16, 8];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    D.waterBonus[i] = dist[i] <= 5 ? bonus[dist[i]] : 0;
    let land = 0, water = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (!inb(nx, ny)) continue;
      if (S.terrain[ny * N + nx]) water++; else if (Math.abs(dx) + Math.abs(dy) === 1) land++;
    }
    D.shallow[i] = S.terrain[i] && land > 0 ? 1 : 0;
    D.beach[i] = !S.terrain[i] && water > 0 ? 1 : 0;
  }
}

/* =========================================================
   シミュレーション
   ========================================================= */
function consumption(i) {
  const t = S.type[i];
  if (isZone(t)) return S.level[i];
  if (t >= 6 && S.owner[i] === i) return BLD[t].use || 0;
  return 0;
}

const _q = new Int32Array(NN), _mark = new Int32Array(NN), _seen = new Uint8Array(NN);
let markGen = 0;
function computePower() {
  const pw = D.powered;
  pw.fill(0); _seen.fill(0);
  let supply = 0, demand = 0;
  for (let i = 0; i < NN; i++) demand += consumption(i);
  for (let i = 0; i < NN; i++) {
    if (!isPlant(S.type[i]) || _seen[i]) continue;
    let qh = 0, qt = 0, cap = 0;
    const plants = [];
    _q[qt++] = i; _seen[i] = 1;
    while (qh < qt) {
      const c = _q[qh++], ct = S.type[c];
      if (isPlant(ct)) { plants.push(c); if (S.owner[c] === c) cap += BLD[ct].supply; }
      const cx = c % N, cy = (c / N) | 0;
      for (let d = 0; d < 4; d++) {
        const nx = cx + DX[d], ny = cy + DY[d];
        if (!inb(nx, ny)) continue;
        const n = ny * N + nx;
        if (!_seen[n] && S.type[n] !== T.EMPTY) { _seen[n] = 1; _q[qt++] = n; }
      }
    }
    supply += cap;
    markGen++;
    qh = 0; qt = 0;
    for (const p of plants) { _q[qt++] = p; _mark[p] = markGen; pw[p] = 1; }
    while (qh < qt) {
      const c = _q[qh++], cx = c % N, cy = (c / N) | 0;
      for (let d = 0; d < 4; d++) {
        const nx = cx + DX[d], ny = cy + DY[d];
        if (!inb(nx, ny)) continue;
        const n = ny * N + nx;
        if (S.type[n] === T.EMPTY || _mark[n] === markGen) continue;
        _mark[n] = markGen;
        const need = consumption(n);
        if (cap > 0 && need <= cap) { cap -= need; pw[n] = 1; }
        _q[qt++] = n;
      }
    }
  }
  // multi-tile buildings share the origin's power state
  for (let i = 0; i < NN; i++) { const o = S.owner[i]; if (o >= 0 && o !== i) pw[i] = pw[o]; }
  let unpowered = 0;
  for (let i = 0; i < NN; i++) if (isZone(S.type[i]) && !pw[i]) unpowered++;
  ST.supply = supply; ST.demand = demand; ST.unpowered = unpowered;
}

const PSA = new Float64Array((N + 1) * (N + 1)), PSB = new Float64Array((N + 1) * (N + 1));
function buildPS(ps, get) {
  const W = N + 1;
  for (let y = 0; y < N; y++) {
    let row = 0;
    for (let x = 0; x < N; x++) { row += get(y * N + x); ps[(y + 1) * W + x + 1] = ps[y * W + x + 1] + row; }
  }
}
function boxSum(ps, x0, y0, x1, y1) {
  if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0; if (x1 > N - 1) x1 = N - 1; if (y1 > N - 1) y1 = N - 1;
  if (x0 > x1 || y0 > y1) return 0;
  const W = N + 1;
  return ps[(y1 + 1) * W + x1 + 1] - ps[y0 * W + x1 + 1] - ps[(y1 + 1) * W + x0] + ps[y0 * W + x0];
}

function computeAccess() {
  buildPS(PSA, i => (S.type[i] === T.ROAD ? 1 : 0));
  let noRoad = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, a = boxSum(PSA, x - 2, y - 2, x + 2, y + 2) > 0 ? 1 : 0;
    D.access[i] = a;
    if (!a && isZone(S.type[i])) noRoad++;
  }
  ST.noRoad = noRoad;
}

function stamp(arr, cx, cy, R, strength) {
  const y0 = Math.max(0, Math.floor(cy - R)), y1 = Math.min(N - 1, Math.ceil(cy + R));
  const x0 = Math.max(0, Math.floor(cx - R)), x1 = Math.min(N - 1, Math.ceil(cx + R));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
    if (d > R) continue;
    const v = strength * (1 - 0.6 * d / R), i = y * N + x;
    if (v > arr[i]) arr[i] = v;
  }
}
function computeCoverage() {
  for (const k in D.cov) D.cov[k].fill(0);
  for (let i = 0; i < NN; i++) {
    const t = S.type[i];
    if (t < 6 || S.owner[i] !== i) continue;
    const b = BLD[t], x = i % N, y = (i / N) | 0, c = b.size / 2;
    if (b.cov) stamp(D.cov[b.cov], x + c, y + c, b.radius, D.powered[i] ? 255 : 110);
    if (t === T.PARK) stamp(D.cov.park, x + 0.5, y + 0.5, 4, 255);
  }
}

const fa = new Float32Array(NN), fb = new Float32Array(NN);
function blur(a, passes) {
  for (let p = 0; p < passes; p++) {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let s = 0, c = 0;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy;
        if (yy < 0 || yy >= N) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx;
          if (xx < 0 || xx >= N) continue;
          s += a[yy * N + xx]; c++;
        }
      }
      fb[y * N + x] = s / c;
    }
    a.set(fb);
  }
}

function computeMaps() {
  computeCoverage();
  // traffic: trips generated nearby, shared by the roads that carry them
  buildPS(PSA, i => (isZone(S.type[i]) ? S.level[i] * S.level[i] : 0));
  buildPS(PSB, i => (S.type[i] === T.ROAD ? 1 : 0));
  let jam = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    if (S.type[i] !== T.ROAD) { D.traffic[i] = 0; continue; }
    const trips = boxSum(PSA, x - 3, y - 3, x + 3, y + 3), roads = boxSum(PSB, x - 3, y - 3, x + 3, y + 3);
    const v = Math.min(255, (trips / Math.max(1, roads)) * 16);
    D.traffic[i] = v;
    if (v > 220) jam++;
  }
  // pollution
  for (let i = 0; i < NN; i++) {
    const t = S.type[i];
    let p = 0;
    if (t === T.IND) p = [0, 35, 70, 110][S.level[i]];
    else if (t === T.COAL) p = 300;
    else if (t === T.ROAD) p = D.traffic[i] * 0.3;
    else if (t === T.COM) p = S.level[i] * 6;
    if (S.tree[i]) p -= 25;
    if (t === T.PARK) p -= 40;
    fa[i] = p;
  }
  blur(fa, 3);
  for (let i = 0; i < NN; i++) D.poll[i] = clamp(fa[i] * 2, 0, 255);
  // crime
  for (let i = 0; i < NN; i++) {
    const t = S.type[i], L = S.level[i];
    fa[i] = (t === T.RES || t === T.COM) && L > 0 ? 18 + L * 22 + (D.lv[i] < 70 ? 25 : 0) : 0;
  }
  blur(fa, 2);
  for (let i = 0; i < NN; i++) D.crime[i] = clamp(fa[i] * 1.6 - D.cov.police[i] * 0.9, 0, 255);
  // land value
  buildPS(PSA, i => S.tree[i]);
  let crimeHigh = 0, pollHigh = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    if (S.terrain[i] && S.type[i] === T.EMPTY) { D.lv[i] = 0; continue; }
    const trees = boxSum(PSA, x - 2, y - 2, x + 2, y + 2);
    const v = 70 + D.waterBonus[i] + Math.min(30, trees * 3) + D.cov.park[i] * 0.3 + D.cov.school[i] * 0.12 +
      D.cov.health[i] * 0.12 + D.cov.police[i] * 0.05 - D.poll[i] * 0.75 - D.crime[i] * 0.4;
    D.lv[i] = clamp(v, 0, 255);
    const t = S.type[i];
    if (S.level[i] > 0) {
      if ((t === T.RES || t === T.COM) && D.crime[i] > 120) crimeHigh++;
      if (t === T.RES && D.poll[i] > 80) pollHigh++;
    }
  }
  ST.jam = jam; ST.crimeHigh = crimeHigh; ST.pollHigh = pollHigh;
  roadListDirty = true;
}

function adjustTotals(t, L, s) {
  if (t === T.RES) ST.pop += s * POP[L];
  else if (t === T.COM) ST.jc += s * JOBS_C[L];
  else if (t === T.IND) ST.ji += s * JOBS_I[L];
  else return;
  if (L > 0) ST.developed += s;
}
function recountTotals() {
  ST.pop = ST.jc = ST.ji = ST.developed = 0;
  for (let i = 0; i < NN; i++) if (isZone(S.type[i])) adjustTotals(S.type[i], S.level[i], 1);
}
function setLevel(i, L) {
  const t = S.type[i], old = S.level[i];
  if (old === L) return;
  adjustTotals(t, old, -1);
  adjustTotals(t, L, 1);
  S.level[i] = L;
  if (L > old || L === 0) S.variant[i] = (rand() * 256) | 0;
  markTile(i);
  flags.power = true;
  computeDemand();
}

function computeDemand() {
  const P = ST.pop, W = P * 0.6, k = Math.min(1, P / 200000);
  const iT = W * (0.5 - 0.2 * k) + 150;
  const cT = W * (0.42 + 0.2 * k) + 30;
  const rT = ((ST.jc + ST.ji) / 0.6) * 1.15 + 250;
  const taxMod = (8 - S.tax) * 0.05;
  ST.dr = clamp((rT - P) / Math.max(200, rT * 0.3) + taxMod, -1, 1);
  ST.dc = clamp((cT - ST.jc) / Math.max(100, cT * 0.3) + taxMod * 0.6, -1, 1);
  ST.di = clamp((iT - ST.ji) / Math.max(150, iT * 0.3) + taxMod * 0.6, -1, 1);
}

function maxLevel(i, t) {
  const lv = D.lv[i];
  if (t === T.RES) return lv < 40 ? 1 : lv < 92 ? 2 : (lv < 150 || D.cov.school[i] < 40 || ST.pop < 15000) ? 3 : 4;
  if (t === T.COM) return lv < 40 ? 1 : lv < 85 ? 2 : (lv < 140 || ST.pop < 30000) ? 3 : 4;
  return ST.pop < 1500 ? 2 : 3;
}
function desirability(i, t) {
  const lv = D.lv[i];
  if (t === T.RES) return (lv - 90) / 110 - D.poll[i] / 180 - D.crime[i] / 220 + D.cov.health[i] / 900 + D.cov.school[i] / 900;
  if (t === T.COM) return (lv - 80) / 130 - D.crime[i] / 250 - D.poll[i] / 400;
  return 0.2 - D.crime[i] / 400;
}
function growTile(i) {
  const t = S.type[i], L = S.level[i];
  if (S.fire[i]) return;
  if (!D.powered[i] || !D.access[i]) { if (L > 0 && rand() < 0.2) setLevel(i, L - 1); return; }
  const dem = t === T.RES ? ST.dr : t === T.COM ? ST.dc : ST.di;
  const des = desirability(i, t), max = maxLevel(i, t);
  if (L > max) { if (rand() < 0.15) setLevel(i, L - 1); return; }
  if (dem > 0 && L < max) {
    const p = 0.05 + dem * clamp(0.55 + des * 0.5, 0.1, 1) * 0.6;
    if (rand() < p) setLevel(i, L + 1);
  } else if (L > 0 && (dem < -0.25 || des < -0.8)) {
    if (rand() < 0.04 + Math.max(0, -dem) * 0.08) setLevel(i, L - 1);
  }
}

function computeBudget() {
  const tx = S.tax / 100;
  const inc = { res: ST.pop * 0.7 * tx, com: ST.jc * 0.9 * tx, ind: ST.ji * 0.8 * tx };
  let roads = 0, bridges = 0, wires = 0;
  const cnt = {}, zones = { 3: 0, 4: 0, 5: 0 };
  for (let i = 0; i < NN; i++) {
    const t = S.type[i];
    if (t === T.ROAD) { if (S.terrain[i]) bridges++; else roads++; }
    else if (t === T.WIRE) wires++;
    else if (isZone(t)) zones[t]++;
    else if (t >= 6 && S.owner[i] === i) cnt[t] = (cnt[t] || 0) + 1;
  }
  const c = t => cnt[t] || 0;
  const exp = {
    road: roads * 0.3 + bridges * 1.5 + wires * 0.05,
    power: c(T.COAL) * 60 + c(T.SOLAR) * 20,
    police: c(T.POLICE) * 40, fire: c(T.FIRE) * 40,
    school: c(T.SCHOOL) * 100, health: c(T.HOSP) * 150, park: c(T.PARK) * 3,
  };
  const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
  ST.inc = inc; ST.exp = exp; ST.cnt = cnt; ST.zones = zones;
  ST.incTotal = sum(inc); ST.expTotal = sum(exp);
  ST.net = Math.round(ST.incTotal) - Math.round(ST.expTotal);
  ST.roads = roads; ST.bridges = bridges; ST.wires = wires;
}

function fireStep() {
  let burning = 0;
  for (let i = 0; i < NN; i++) {
    if (!S.fire[i]) continue;
    if (!isZone(S.type[i]) || S.level[i] === 0) { S.fire[i] = 0; continue; }
    burning++;
    S.fire[i]++;
    const cov = D.cov.fire[i];
    if (cov > 60 && S.fire[i] > 2 + (255 - cov) / 40) {
      S.fire[i] = 0;
      if (!S.seen.extinguish) { S.seen.extinguish = 1; toast('消防隊が火事を消し止めました。', { kind: 'good' }); }
      continue;
    }
    if (S.fire[i] > 10) { S.fire[i] = 0; setLevel(i, 0); continue; }
    if (rand() < 0.07) {
      const d = (rand() * 4) | 0, x = i % N + DX[d], y = ((i / N) | 0) + DY[d];
      if (inb(x, y)) {
        const n = y * N + x;
        if (isZone(S.type[n]) && S.level[n] > 0 && !S.fire[n] && rand() > D.cov.fire[n] / 255) S.fire[n] = 1;
      }
    }
  }
  if (S.disasters && ST.developed > 30 && rand() < 0.004 + ST.developed * 0.000004) {
    for (let k = 0; k < 40; k++) {
      const i = (rand() * NN) | 0;
      if (isZone(S.type[i]) && S.level[i] > 0 && !S.fire[i]) {
        if (rand() > D.cov.fire[i] / 200) {
          S.fire[i] = 1;
          toast('火事が発生しました！ 消防署の範囲内ならすぐに消し止められます。', { kind: 'bad', action: { label: '見る', fn: () => flyTo(i) } });
        }
        break;
      }
    }
  }
  ST.burning = burning;
}

const flags = { power: true, maps: true, access: true };
function refreshAll() {
  markAll();
  computeStatic();
  recountTotals();
  computeAccess();
  computePower();
  computeMaps();
  computeMaps();
  computeDemand();
  computeBudget();
  flags.power = flags.maps = flags.access = false;
}

function simDay() {
  if (flags.access) { computeAccess(); flags.access = false; }
  if (flags.power) { computePower(); flags.power = false; }
  if (flags.maps || S.day % 4 === 0) { computeMaps(); flags.maps = false; }
  for (let i = 0; i < NN; i++) if (isZone(S.type[i]) && rand() < 0.16) growTile(i);
  fireStep();
  S.day++;
  if (S.day > 30) { S.day = 1; endOfMonth(); }
  hudDirty = true; dirty = true;
  if (sheetKind === 'info' && rand() < 0.25) refreshSheet();
}

function endOfMonth() {
  computePower();
  computeBudget();
  S.money += ST.net;
  S.fy.inc += Math.round(ST.incTotal); S.fy.exp += Math.round(ST.expTotal);
  S.month++;
  if (S.month > 12) { S.month = 1; S.year++; }
  S.history.push({ y: S.year, m: S.month, pop: ST.pop, money: Math.round(S.money) });
  if (S.history.length > 240) S.history.shift();
  if (S.month === 4) {
    const net = S.fy.inc - S.fy.exp;
    toast(`${S.year - 1}年度の決算：収入 ${yen(S.fy.inc)}、支出 ${yen(S.fy.exp)}、差し引き ${net >= 0 ? '+' : ''}${yen(net)}`, { kind: net >= 0 ? 'good' : 'warn', ttl: 6500 });
    S.fy = { inc: 0, exp: 0 };
  }
  checkRank();
  advise();
  checkTutorial();
  if (sheetKind === 'budget') refreshSheet();
  save();
}

function rankIndex(pop) { let r = 0; for (let k = 0; k < RANKS.length; k++) if (pop >= RANKS[k].min) r = k; return r; }
function cityName() { return S.name + RANKS[S.rank].suffix; }
function checkRank() {
  const r = rankIndex(ST.pop);
  if (r > S.rank) {
    const before = cityName();
    S.rank = r;
    toast(`おめでとうございます！ ${before}は人口${compact(RANKS[r].min)}人を超え、「${RANKS[r].label}」になりました。`, { kind: 'good', ttl: 7000 });
  }
}

function advise() {
  const c = t => ST.cnt[t] || 0;
  const plants = c(T.COAL) + c(T.SOLAR);
  const list = [];
  if (!plants) list.push(['plant', '発電所がありません。まずは火力発電所か太陽光発電所を建てましょう。', 'warn']);
  else if (ST.demand > ST.supply) list.push(['short', `電力が足りません（使用 ${num(ST.demand)}／発電 ${num(ST.supply)}）。発電所を増やしましょう。`, 'warn']);
  if (plants && ST.unpowered > 3) list.push(['unpow', `電気が届いていない区画が${ST.unpowered}マスあります。道路か送電線で発電所とつなぎましょう。`, 'warn']);
  if (ST.noRoad > 3) list.push(['noroad', `道路から離れた区画が${ST.noRoad}マスあります。区画は道路から2マス以内でないと発展しません。`, 'warn']);
  if (S.money < 0) list.push(['debt', '資金がマイナスです。税率を上げるか、維持費のかかる施設を見直しましょう。', 'bad']);
  else if (ST.net < 0 && S.money < 5000) list.push(['deficit', `毎月 ${yen(-ST.net)} の赤字です。「市政」で税率を見直しましょう。`, 'warn']);
  if (ST.crimeHigh > 8 && !c(T.POLICE)) list.push(['police', '犯罪が増えてきました。警察署を建てましょう。', 'warn']);
  else if (ST.crimeHigh > 20) list.push(['crime', '治安の悪い地区があります。「表示」→「犯罪」で場所を確かめましょう。', 'warn']);
  if (ST.pollHigh > 12) list.push(['poll', '住宅地の汚染がひどくなっています。工業地から離すか、公園を増やしましょう。', 'warn']);
  if (ST.jam > 6) list.push(['jam', '渋滞している道路があります。道路を増やして交通を分散させましょう。', 'warn']);
  if (ST.pop > 1500 && !c(T.FIRE)) list.push(['firest', '消防署がありません。火事に備えて消防署を建てましょう。', 'info']);
  if (ST.pop > 3000 && !c(T.SCHOOL)) list.push(['school', '子どもが増えてきました。学校を建てると地価が上がります。', 'info']);
  if (ST.pop > 8000 && !c(T.HOSP)) list.push(['hosp', '病院を建てると住みやすさと地価が上がります。', 'info']);
  if (ST.dr > 0.5) list.push(['dr', '住宅の需要が高まっています。住宅地を増やしましょう。', 'info']);
  if (ST.dc > 0.5 && ST.pop > 300) list.push(['dc', '商業の需要が高まっています。商業地を増やしましょう。', 'info']);
  if (ST.di > 0.5) list.push(['di', '工業の需要が高まっています。工業地を増やしましょう。', 'info']);
  const m = S.year * 12 + S.month;
  for (const [k, msg, kind] of list) {
    if ((S.seen[k] ?? -99) + 3 <= m) { S.seen[k] = m; toast(msg, { kind }); break; }
  }
}

/* =========================================================
   建設
   ========================================================= */
function linePts(ax, ay, bx, by) {
  const pts = [[ax, ay]];
  let x = ax, y = ay;
  const stepX = () => { while (x !== bx) { x += Math.sign(bx - x); pts.push([x, y]); } };
  const stepY = () => { while (y !== by) { y += Math.sign(by - y); pts.push([x, y]); } };
  if (Math.abs(bx - ax) >= Math.abs(by - ay)) { stepX(); stepY(); } else { stepY(); stepX(); }
  return pts;
}
function rectPts(ax, ay, bx, by) {
  const pts = [];
  for (let y = Math.min(ay, by); y <= Math.max(ay, by); y++) for (let x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) pts.push([x, y]);
  return pts;
}
/* cost ≥ 0: will change, -1: nothing to do, -2: blocked */
function evalTile(tid, i) {
  const t = S.type[i], water = S.terrain[i] === 1;
  switch (tid) {
    case 'road':
      if (t === T.ROAD) return -1;
      if (water) return t === T.EMPTY || t === T.WIRE ? 60 : -2;
      if (t === T.EMPTY || t === T.WIRE || (isZone(t) && S.level[i] === 0)) return 10;
      return -2;
    case 'wire':
      if (t !== T.EMPTY) return -1;
      return water ? 25 : 5;
    case 'res': case 'com': case 'ind': {
      const zt = TOOLS[tid].zone;
      if (water) return -2;
      if (t === zt) return -1;
      if (t === T.EMPTY || t === T.WIRE || (isZone(t) && S.level[i] === 0)) return 5;
      return -2;
    }
    case 'bulldoze':
      if (t === T.EMPTY) return S.tree[i] ? 2 : -1;
      return 2;
  }
  return -1;
}
function makePlan(tid, d) {
  const tool = TOOLS[tid], items = [];
  let cost = 0, ok = 0, bad = 0;
  if (tool.kind === 'place') {
    const b = BLD[tool.b], s = b.size;
    let valid = true;
    for (let y = d.ay; y < d.ay + s; y++) for (let x = d.ax; x < d.ax + s; x++) {
      if (!inb(x, y)) { valid = false; continue; }
      const i = y * N + x, good = S.terrain[i] === 0 && S.type[i] === T.EMPTY;
      if (!good) { valid = false; bad++; }
      items.push({ i, ok: good });
    }
    if (valid) { cost = b.cost; ok = items.length; }
    return { items, cost, ok, bad, valid };
  }
  const pts = tool.kind === 'line' ? linePts(d.ax, d.ay, d.bx, d.by) : rectPts(d.ax, d.ay, d.bx, d.by);
  const seen = new Set();
  for (const [x, y] of pts) {
    const i = y * N + x;
    if (tid === 'bulldoze' && S.owner[i] >= 0) {
      const o = S.owner[i];
      if (seen.has(o)) continue;
      seen.add(o);
      const s = BLD[S.type[o]].size, ox = o % N, oy = (o / N) | 0;
      for (let yy = oy; yy < oy + s; yy++) for (let xx = ox; xx < ox + s; xx++) items.push({ i: yy * N + xx, ok: true });
      cost += 2 * s * s; ok += s * s;
      continue;
    }
    const c = evalTile(tid, i);
    if (c >= 0) { items.push({ i, ok: true }); cost += c; ok++; }
    else if (c === -2) { items.push({ i, ok: false }); bad++; }
    else items.push({ i, ok: null });
  }
  return { items, cost, ok, bad, valid: ok > 0 };
}
function clearTile(i) {
  markTile(i);
  const t = S.type[i];
  if (isZone(t) && S.level[i] > 0) adjustTotals(t, S.level[i], -1);
  S.type[i] = T.EMPTY; S.level[i] = 0; S.tree[i] = 0; S.owner[i] = -1; S.fire[i] = 0;
}
function applyPlan(tid, plan, at) {
  const tool = TOOLS[tid];
  if (!plan.valid) {

  mk('path', { d: line }, 'ch-line');
  const t0 = mk('text', { x: L, y: H - 4 }, 'ch-txt'); t0.textContent = data[0].label;
  const t1 = mk('text', { x: W - R, y: H - 4, 'text-anchor': 'end' }, 'ch-txt'); t1.textContent = data[data.length - 1].label;
  const last = data[data.length - 1];
  mk('circle', { cx: xs(data.length - 1), cy: ys(last.v), r: 4 }, 'ch-dot');
  const et = mk('text', { x: xs(data.length - 1) - 8, y: ys(last.v) - 9, 'text-anchor': 'end' }, 'ch-end'); et.textContent = fmt(last.v);
  const cross = mk('line', { x1: 0, x2: 0, y1: TP, y2: H - B, visibility: 'hidden' }, 'ch-cross');
  const hot = mk('circle', { cx: 0, cy: 0, r: 4, visibility: 'hidden' }, 'ch-dot');
  const tip = el('div', 'tip'); tip.hidden = true;
  host.append(svg, tip);
  const move = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width;
    const k = clamp(Math.round((sx - L) / (W - L - R) * (data.length - 1)), 0, data.length - 1);
    const px = xs(k), py = ys(data[k].v);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    hot.setAttribute('cx', px); hot.setAttribute('cy', py); hot.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.textContent = `${data[k].label}　${fmt(data[k].v)}`;
    tip.style.left = clamp(px * r.width / W, 70, r.width - 70) + 'px';
    tip.style.top = '-6px';
  };
  const leave = () => { cross.setAttribute('visibility', 'hidden'); hot.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', leave);
  svg.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') setTimeout(leave, 1500); });
}

function buildLayers(body, title) {
  title.textContent = 'マップ表示';
  const grid = el('div', 'layer-grid');
  for (const id in LAYERS) {
    const b = el('button', null, LAYERS[id].name);
    b.type = 'button'; b.setAttribute('aria-pressed', String(overlay === id));
    b.addEventListener('click', () => { setOverlay(id); refreshSheet(); });
    grid.append(b);
  }
  body.append(grid, el('p', 'note', 'データを色で表示します。表示中は建物が低く描かれます。'));
}
function setOverlay(id) {
  overlay = id; dirty = true;
  $('#btn-layer').setAttribute('aria-pressed', String(id !== 'none' || sheetKind === 'layers'));
  const lg = $('#legend');
  const L = LAYERS[id];
  if (id === 'none') { lg.hidden = true; return; }
  lg.hidden = false; lg.replaceChildren(el('h3', null, L.name));
  if (L.keys) {
    const k = el('div', 'keys');
    for (const [c, t] of L.keys) { const s = el('span'); const i = el('i'); i.style.background = c; s.append(i, document.createTextNode(t)); k.append(s); }
    lg.append(k);
  } else {
    const r = el('div', 'ramp');
    for (const c of L.ramp) { const i = el('i'); i.style.background = c; r.append(i); }
    lg.append(el('span', 'lo', L.lo), r, el('span', 'hi', L.hi));
  }
  const x = el('button', 'x', '×');
  x.type = 'button'; x.setAttribute('aria-label', 'マップ表示を終える');
  x.addEventListener('click', () => { setOverlay('none'); if (sheetKind === 'layers') refreshSheet(); });
  lg.append(x);
}

let confirmNew = false;
function buildMenu(body, title) {
  title.textContent = '設定';
  const s1 = el('section');
  s1.append(el('h3', null, 'まちの名前'));
  const row = el('div', 'name-row');
  const inp = document.createElement('input');
  inp.id = 'rename-city'; inp.maxLength = 8; inp.value = S.name; inp.autocomplete = 'off';
  inp.addEventListener('change', () => { const v = inp.value.trim(); if (v) { S.name = v; hudDirty = true; save(); } });
  row.append(inp, el('span', 'suffix', RANKS[S.rank].suffix));
  s1.append(row);
  const s2 = el('section');
  s2.append(el('h3', null, 'ゲーム'));
  const sw = el('label', 'switch-row');
  sw.htmlFor = 'opt-disaster';
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.id = 'opt-disaster'; cb.checked = S.disasters;
  cb.addEventListener('change', () => { S.disasters = cb.checked; save(); });
  sw.append(el('span', null, '火災を発生させる'), cb);
  s2.append(sw);
  const s3 = el('section');
  s3.append(el('h3', null, 'あそびかた'));
  const ol = el('ol', 'help');
  [
    '発電所を建てます。電気は道路・区画・建物を伝って広がり、離れた場所へは送電線で送ります。',
    '道路を引き、道路から2マス以内に住宅地・商業地・工業地を指定します。',
    '上の需要メーター（住・商・工）が伸びている区画を増やすと、街が育ちます。',
    '公園・学校・病院や水辺は地価を上げ、高い建物が建つようになります。',
    '警察署は犯罪を、消防署は火事を防ぎます。「表示」で範囲を確かめられます。',
    '1本指でツール、2本指で移動・ズーム。「調べる」では1本指で地図を動かせます。',
  ].forEach(s => ol.append(el('li', null, s)));
  s3.append(ol);
  const s4 = el('section');
  s4.append(el('h3', null, 'データ'));
  s4.append(el('p', 'note', '進行状況はこのブラウザに毎月自動で保存されます。ほかの端末やブラウザとは共有されません。'));
  if (!confirmNew) {
    const b = el('button', 'btn danger', '新しい街をつくる');
    b.type = 'button';
    b.addEventListener('click', () => { confirmNew = true; refreshSheet(); });
    s4.append(b);
  } else {
    const c = el('div', 'confirm');
    c.append(el('p', null, `いまの「${cityName()}」は消えてしまいます。新しい土地で始めますか？`));
    const r = el('div', 'btn-row');
    const no = el('button', 'btn', 'やめる'); no.type = 'button';
    no.addEventListener('click', () => { confirmNew = false; refreshSheet(); });
    const yes = el('button', 'btn primary', '新しく始める'); yes.type = 'button';
    yes.addEventListener('click', () => { confirmNew = false; closeSheet(); storageDel(); startNew(); });
    r.append(no, yes); c.append(r); s4.append(c);
  }
  body.append(s1, s2, s3, s4);
}

/* tutorial */
const TUT = [
  ['plant', '発電所を建てる', () => (ST.cnt[T.COAL] || 0) + (ST.cnt[T.SOLAR] || 0) > 0, '「火力発電」を選んで、空き地をタップ'],
  ['road', '道路を10マス引く', () => ST.roads + ST.bridges >= 10, '「道路」を選んで、発電所の近くからなぞる'],
  ['res', '住宅地を指定する', () => ST.zones[3] >= 6, '「住宅地」で道路ぞいをなぞる'],
  ['ind', '工業地を指定する', () => ST.zones[5] >= 4, '住宅から少し離れた道路ぞいに「工業地」'],
  ['com', '商業地を指定する', () => ST.zones[4] >= 4, '「商業地」も道路ぞいに少し'],
  ['pop', '人口500人を達成する', () => ST.pop >= 500, '右上の ▶ で速度を上げて待ってみよう'],
];
function checkTutorial() {
  if (!S || S.tutDone) return;
  let changed = false;
  for (const [k, , f] of TUT) if (!S.tut[k] && f()) { S.tut[k] = 1; changed = true; }
  if (TUT.every(([k]) => S.tut[k])) {
    S.tutDone = true;
    toast('基本はばっちりです。需要メーターを見ながら、街を大きくしていきましょう。', { kind: 'good', ttl: 6500 });
  }
  if (changed || S.tutDone) renderTutorial();
}
function renderTutorial() {
  const box = $('#tut');
  if (!S || S.tutDone || S.tutClosed || !started) { box.hidden = true; return; }
  box.hidden = false;
  box.classList.toggle('min', !!S.tutMin);
  box.replaceChildren();
  const head = el('div', 'tut-head');
  const done = TUT.filter(([k]) => S.tut[k]).length;
  const tb = el('button', 'title', 'はじめての街づくり');
  tb.type = 'button'; tb.setAttribute('aria-expanded', String(!S.tutMin));
  tb.addEventListener('click', () => { S.tutMin = !S.tutMin; renderTutorial(); });
  const x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', 'チュートリアルを閉じる');
  x.addEventListener('click', () => { S.tutClosed = true; renderTutorial(); save(); });
  head.append(tb, el('span', 'count', `${done}/${TUT.length}`), x);
  const ol = el('ol');
  for (const [k, label] of TUT) {
    const li = el('li', S.tut[k] ? 'done' : null);
    li.append(el('i', null, S.tut[k] ? '✓' : ''), el('span', null, label));
    ol.append(li);
  }
  const next = TUT.find(([k]) => !S.tut[k]);
  const nx = el('div', 'tut-next');
  if (next) nx.append(el('b', null, next[1]), el('span', null, next[3]));
  box.append(head, nx, ol);
}

/* =========================================================
   保存
   ========================================================= */
function serialize() {
  return JSON.stringify({
    v: 1, seed: S.seed, name: S.name, money: S.money, year: S.year, month: S.month, day: S.day, tax: S.tax, disasters: S.disasters,
    rank: S.rank, seen: S.seen, fy: S.fy, tut: S.tut, tutDone: S.tutDone, tutClosed: S.tutClosed, tutMin: S.tutMin, history: S.history,
    terrain: b64(S.terrain), tree: b64(S.tree), type: b64(S.type), level: b64(S.level), variant: b64(S.variant), fire: b64(S.fire),
    owner: b64(new Uint8Array(S.owner.buffer)), cam: { x: cam.x, y: cam.y, z: cam.z }, speed: lastSpeed,
  });
}
function deserialize(str) {
  const o = JSON.parse(str);
  if (!o || o.v !== 1) throw new Error('unsupported save');
  const s = blankState(o.seed, o.name);
  for (const k of ['money', 'year', 'month', 'day', 'tax', 'disasters', 'rank', 'seen', 'fy', 'tut', 'tutDone', 'tutClosed', 'tutMin', 'history']) if (o[k] !== undefined) s[k] = o[k];
  for (const k of ['terrain', 'tree', 'type', 'level', 'variant', 'fire']) { const u = unb64(o[k]); if (u.length !== NN) throw new Error('bad map'); s[k].set(u); }
  const ow = unb64(o.owner);
  if (ow.length !== NN * 4) throw new Error('bad map');
  s.owner = new Int32Array(ow.buffer);
  return { state: s, cam: o.cam, speed: o.speed };
}
function storageGet() { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } }
function storageDel() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* storage unavailable */ } }
function save() {
  if (!started || !S) return;
  try { localStorage.setItem(SAVE_KEY, serialize()); } catch (e) { /* storage unavailable: play continues without saving */ }
}

/* =========================================================
   起動
   ========================================================= */
function newMap(seed, name) {
  S = blankState(seed, name);
  genTerrain(seed);
  undoStack.length = 0; cars.length = 0;
  refreshAll();
  roadListDirty = true; dirty = true; hudDirty = true;
}
function fitCamera() {
  const w = $('#welcome'), cover = w.hidden ? 0 : w.offsetHeight + 16;
  const availH = Math.max(160, vh - cover - 24);
  cam.z = clamp(Math.min((vw - 16) / (N * HW * 2), availH / (N * HH * 2 + 40)), ZMIN, 0.5);
  cam.x = 0;
  cam.y = N * HH + 13 + (vh / 2 - (vh - cover) / 2) / cam.z;
  dirty = true;
}
function showWelcome() {
  document.body.classList.add('intro');
  started = false; setSpeed(0);
  const w = $('#welcome');
  w.hidden = false;
  const inp = $('#city-name');
  inp.value = S.name;
  fitCamera();
}
function startNew() {
  const seed = (Math.random() * 2 ** 31) | 0;
  newMap(seed, NAMES[(Math.random() * NAMES.length) | 0]);
  showWelcome();
}
function beginGame() {
  const name = $('#city-name').value.trim() || S.name;
  S.name = name.slice(0, 8);
  $('#welcome').hidden = true;
  document.body.classList.remove('intro');
  started = true;
  resize();
  selectTool('select');
  setSpeed(1);
  // land near the middle, on dry ground
  let best = (N / 2) * N + N / 2, bestScore = -1;
  for (let y = 20; y < 44; y += 2) for (let x = 20; x < 44; x += 2) {
    let s = 0;
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) if (!S.terrain[(y + dy) * N + x + dx]) s++;
    s -= Math.hypot(x - N / 2, y - N / 2) * 0.8;
    if (s > bestScore) { bestScore = s; best = y * N + x; }
  }
  flyTo(best, clamp(vw / 520, 0.7, 1.1));
  S.history = [{ y: S.year, m: S.month, pop: 0, money: S.money }];
  renderTutorial();
  hudDirty = true;
  save();
}

let lastFrame = performance.now(), acc = 0, lastRender = 0, lastHud = 0;
function frame(now) {
  const dt = Math.min(100, now - lastFrame);
  lastFrame = now;
  stepTween(now);
  keyPan(dt);
  if (started && speed > 0) {
    acc += dt;
    const dayMs = [0, 400, 150, 50][speed];
    let n = 0;
    while (acc >= dayMs && n < 6) { acc -= dayMs; simDay(); n++; }
    if (n >= 6) acc = 0;
  }
  if (started) updateCars(dt);
  const animating = (started && speed > 0 && lod > 0) || ST.burning > 0 || floaters.length > 0 || (lod > 0 && ST.unpowered > 0);
  if (dirty || (animating && now - lastRender > 33)) {
    render(now);
    dirty = false; lastRender = now;
  }
  if (hudDirty && now - lastHud > 100 && S) { updateHUD(); hudDirty = false; lastHud = now; }
  requestAnimationFrame(frame);
}

function bindUI() {
  $('#btn-speed').addEventListener('click', () => setSpeed((speed + 1) % 4));
  $('#btn-layer').addEventListener('click', () => (sheetKind === 'layers' ? closeSheet() : openSheet('layers')));
  $('#btn-budget').addEventListener('click', () => (sheetKind === 'budget' ? closeSheet() : openSheet('budget')));
  $('#btn-undo').addEventListener('click', undo);
  $('#btn-menu').addEventListener('click', () => { confirmNew = false; sheetKind === 'menu' ? closeSheet() : openSheet('menu'); });
  $('#sheet-close').addEventListener('click', closeSheet);
  $('#btn-reroll').addEventListener('click', () => {
    const name = $('#city-name').value.trim() || S.name;
    newMap((Math.random() * 2 ** 31) | 0, name);
    fitCamera();
  });
  $('#btn-start').addEventListener('click', beginGame);
  $('#city-name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  new ResizeObserver(resize).observe($('#dock'));
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

function boot(data) {
  bindUI();
  readTheme();
  resize();
  let loaded = null;
  const raw = (data && data.save) || storageGet();
  if (raw) { try { loaded = deserialize(raw); } catch (e) { loaded = null; } }
  if (loaded) {
    S = loaded.state;
    refreshAll();
    buildToolbar();
    document.body.classList.remove('intro');
    started = true;
    resize();
    if (loaded.cam) { cam.x = loaded.cam.x; cam.y = loaded.cam.y; cam.z = loaded.cam.z; clampCam(); }
    selectTool('select');
    setSpeed(clamp(loaded.speed || 1, 1, 3));
    renderTutorial();
    toast(`おかえりなさい。${cityName()}の${S.year}年${S.month}月から再開します。`);
  } else {
    newMap((Math.random() * 2 ** 31) | 0, NAMES[(Math.random() * NAMES.length) | 0]);
    buildToolbar();
    showWelcome();
  }
  updateHint();
  hudDirty = true;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dirty = true; resize(); });
  requestAnimationFrame(t => { lastFrame = t; frame(t); });
}

try { window.claude?.hot?.snapshot?.(() => (started ? { save: serialize() } : {})); } catch (e) { /* not in a viewer */ }
const hot = window.claude?.hot;
if (hot?.ready) hot.ready(boot); else boot(hot?.data ?? {});

/* debugging / automated checks */
window.__city = {
  get S() { return S; }, ST, D, T, TOOLS, cam, simDay, makePlan, applyPlan, render, refreshAll, setSpeed, selectTool, beginGame, setOverlay,
  run(days) { for (let k = 0; k < days; k++) simDay(); },
  place(tid, ax, ay, bx = ax, by = ay) { return applyPlan(tid, makePlan(tid, { ax, ay, bx, by })); },
};
})();
</script>
